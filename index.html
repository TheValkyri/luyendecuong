<style>
/* ==========================================================================
   DESIGN TOKENS & HIGH-END THEMES
   ========================================================================== */
:root {
  --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-serif: 'Newsreader', Georgia, serif;
  --font-mono: 'JetBrains Mono', monospace;
  --radius-xs: 6px;
  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-xl: 28px;
  --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
  --transition: 0.22s var(--ease-smooth);
}

/* DARK OBSIDIAN THEME (Default) */
[data-theme="dark"] {
  --bg-app: #0c0e12;
  --bg-surface: #12161d;
  --bg-surface-elevated: #181d26;
  --bg-card: #151922;
  --bg-card-hover: #1c222e;
  --bg-active: rgba(255, 255, 255, 0.06);
  --border-subtle: rgba(255, 255, 255, 0.07);
  --border-strong: rgba(255, 255, 255, 0.14);
  --border-accent: rgba(79, 120, 255, 0.4);
  
  --text-primary: #f2f4f8;
  --text-secondary: #9aa2b2;
  --text-tertiary: #606878;
  
  --accent-base: #4f78ff;
  --accent-hover: #3d68f5;
  --accent-soft: rgba(79, 120, 255, 0.12);
  --accent-glow: rgba(79, 120, 255, 0.25);
  
  --success: #10b981;
  --success-soft: rgba(16, 185, 129, 0.12);
  --danger: #ef4444;
  --danger-soft: rgba(239, 68, 68, 0.12);
  --warning: #f59e0b;
  --warning-soft: rgba(245, 158, 11, 0.14);
  
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
  --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.5);
  --sheet-scrim: rgba(0, 0, 0, 0.7);
}

/* EDITORIAL PAPER LIGHT THEME */
[data-theme="light"] {
  --bg-app: #f7f7f5;
  --bg-surface: #ffffff;
  --bg-surface-elevated: #f0f0ed;
  --bg-card: #ffffff;
  --bg-card-hover: #f3f3f0;
  --bg-active: rgba(0, 0, 0, 0.05);
  --border-subtle: rgba(0, 0, 0, 0.08);
  --border-strong: rgba(0, 0, 0, 0.16);
  --border-accent: rgba(37, 99, 235, 0.4);
  
  --text-primary: #15171b;
  --text-secondary: #585d68;
  --text-tertiary: #8e95a2;
  
  --accent-base: #2563eb;
  --accent-hover: #1d4ed8;
  --accent-soft: rgba(37, 99, 235, 0.08);
  --accent-glow: rgba(37, 99, 235, 0.2);
  
  --success: #059669;
  --success-soft: rgba(5, 150, 105, 0.1);
  --danger: #dc2626;
  --danger-soft: rgba(220, 38, 38, 0.1);
  --warning: #d97706;
  --warning-soft: rgba(217, 119, 6, 0.12);
  
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
  --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.08);
  --sheet-scrim: rgba(15, 23, 42, 0.4);
}

/* EYE-CARE SEPIA THEME */
[data-theme="sepia"] {
  --bg-app: #f4ede2;
  --bg-surface: #ede3d3;
  --bg-surface-elevated: #e4d8c5;
  --bg-card: #faf5ec;
  --bg-card-hover: #f2e9dc;
  --bg-active: rgba(92, 65, 33, 0.08);
  --border-subtle: rgba(110, 80, 45, 0.12);
  --border-strong: rgba(110, 80, 45, 0.22);
  --border-accent: rgba(160, 90, 40, 0.45);
  
  --text-primary: #2d241c;
  --text-secondary: #6e5e4f;
  --text-tertiary: #9c8a77;
  
  --accent-base: #a05a28;
  --accent-hover: #86461c;
  --accent-soft: rgba(160, 90, 40, 0.12);
  --accent-glow: rgba(160, 90, 40, 0.25);
  
  --success: #2e7d32;
  --success-soft: rgba(46, 125, 50, 0.12);
  --danger: #c62828;
  --danger-soft: rgba(198, 40, 40, 0.12);
  --warning: #b45309;
  --warning-soft: rgba(180, 83, 9, 0.14);
  
  --shadow-sm: 0 2px 8px rgba(80, 50, 20, 0.06);
  --shadow-lg: 0 16px 40px rgba(80, 50, 20, 0.12);
  --sheet-scrim: rgba(45, 36, 28, 0.5);
}

/* ==========================================================================
   RESET & FOUNDATIONS
   ========================================================================== */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}
html {
  font-size: 16px;
  background: var(--bg-app);
  color: var(--text-primary);
  font-family: var(--font-sans);
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
  scroll-behavior: smooth;
}
body {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
  background: var(--bg-app);
  line-height: 1.55;
}
button, input, textarea, select {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
  border: none;
  background: none;
}
button {
  cursor: pointer;
  user-select: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  transition: all var(--transition);
}
a {
  color: inherit;
  text-decoration: none;
}

/* VECTOR ICON COMPONENT */
.v-icon {
  display: inline-block;
  vertical-align: -0.15em;
  flex-shrink: 0;
  stroke: currentColor;
}
.icon-btn .v-icon {
  vertical-align: middle;
}

/* ==========================================================================
   TOP FLOATING APP BAR
   ========================================================================== */
.app-header {
  position: sticky;
  top: 0;
  z-index: 40;
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border-subtle);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  padding: 0.65rem 1rem;
  transition: background var(--transition);
}
.app-header-inner {
  max-width: 900px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
}
.brand-group {
  display: flex;
  align-items: center;
  gap: 0.65rem;
  min-width: 0;
}
.brand-badge {
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  background: var(--accent-base);
  color: #ffffff;
  padding: 0.25rem 0.55rem;
  border-radius: var(--radius-xs);
  text-transform: uppercase;
  flex-shrink: 0;
}
.brand-title {
  font-size: 0.88rem;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  letter-spacing: -0.01em;
}
.header-actions {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  flex-shrink: 0;
}
.icon-btn {
  width: 2.25rem;
  height: 2.25rem;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-subtle);
  background: var(--bg-surface-elevated);
  color: var(--text-secondary);
  font-size: 0.95rem;
  transition: all var(--transition);
}
.icon-btn:hover {
  color: var(--text-primary);
  border-color: var(--border-strong);
  transform: translateY(-1px);
}
.icon-btn:active {
  transform: scale(0.95);
}
.timer-chip {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.28rem 0.65rem;
  background: var(--bg-surface-elevated);
  border: 1px solid var(--border-subtle);
  border-radius: 999px;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--text-primary);
}
.timer-indicator {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--success);
  box-shadow: 0 0 8px var(--success);
  animation: pulse 2s infinite ease-in-out;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(0.85); }
}

/* ==========================================================================
   NAVIGATION PALETTE & TABS
   ========================================================================== */
.section-tabs-bar {
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border-subtle);
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.section-tabs-bar::-webkit-scrollbar {
  display: none;
}
.section-tabs {
  max-width: 900px;
  margin: 0 auto;
  display: flex;
  padding: 0.4rem 1rem;
  gap: 0.4rem;
  white-space: nowrap;
}
.sec-tab {
  font-size: 0.78rem;
  font-weight: 600;
  padding: 0.4rem 0.75rem;
  border-radius: 999px;
  color: var(--text-secondary);
  border: 1px solid transparent;
  transition: all var(--transition);
}
.sec-tab:hover {
  color: var(--text-primary);
  background: var(--bg-active);
}
.sec-tab.active {
  color: var(--accent-base);
  background: var(--accent-soft);
  border-color: var(--border-accent);
}
.sec-tab .tab-badge {
  font-size: 0.7rem;
  opacity: 0.75;
  margin-left: 0.25rem;
  font-family: var(--font-mono);
}

/* ==========================================================================
   VIEW MODES BAR (Focus vs List)
   ========================================================================== */
.mode-toggle-bar {
  max-width: 900px;
  margin: 0.75rem auto 0;
  padding: 0 1rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
}
.view-mode-pill {
  display: inline-flex;
  background: var(--bg-surface);
  padding: 3px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-subtle);
}
.view-mode-btn {
  font-size: 0.76rem;
  font-weight: 600;
  padding: 0.35rem 0.75rem;
  border-radius: calc(var(--radius-sm) - 3px);
  color: var(--text-tertiary);
  transition: all var(--transition);
}
.view-mode-btn.active {
  background: var(--bg-surface-elevated);
  color: var(--text-primary);
  box-shadow: var(--shadow-sm);
}
.passage-drawer-btn {
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--accent-base);
  background: var(--accent-soft);
  border: 1px solid var(--border-accent);
  padding: 0.35rem 0.85rem;
  border-radius: 999px;
  gap: 0.4rem;
}
.passage-drawer-btn:hover {
  background: var(--accent-base);
  color: #fff;
}

/* PROGRESS BAR */
.progress-strip {
  width: 100%;
  height: 3px;
  background: var(--bg-surface-elevated);
}
.progress-strip-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent-base), var(--success));
  width: 0%;
  transition: width 0.4s var(--ease-spring);
}

/* ==========================================================================
   MAIN CONTENT AREA
   ========================================================================== */
.main-viewport {
  flex: 1;
  max-width: 900px;
  width: 100%;
  margin: 0 auto;
  padding: 1rem 1rem 7rem;
}

/* INTRO / WELCOME SCREEN */
.welcome-container {
  max-width: 640px;
  margin: 2rem auto;
  text-align: center;
}
.welcome-card {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-xl);
  padding: 2.25rem 1.75rem;
  box-shadow: var(--shadow-lg);
  position: relative;
  overflow: hidden;
}
.welcome-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 4px;
  background: linear-gradient(90deg, var(--accent-base), var(--success));
}
.school-meta {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  font-weight: 700;
  color: var(--text-tertiary);
  margin-bottom: 0.5rem;
}
.exam-title {
  font-size: 1.6rem;
  font-weight: 800;
  letter-spacing: -0.025em;
  color: var(--text-primary);
  line-height: 1.25;
  margin-bottom: 0.75rem;
}
.exam-subtitle {
  font-size: 0.88rem;
  color: var(--text-secondary);
  margin-bottom: 1.75rem;
  line-height: 1.5;
}
.meta-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.5rem;
  margin-bottom: 1.75rem;
  background: var(--bg-surface);
  padding: 0.75rem;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-subtle);
}
.meta-item {
  display: flex;
  flex-direction: column;
  gap: 0.15rem;
}
.meta-val {
  font-family: var(--font-mono);
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--text-primary);
}
.meta-lbl {
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-tertiary);
}
.name-input-group {
  text-align: left;
  margin-bottom: 1.25rem;
}
.input-label {
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--text-secondary);
  display: block;
  margin-bottom: 0.4rem;
}
.custom-input {
  width: 100%;
  padding: 0.85rem 1rem;
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-size: 0.95rem;
  outline: none;
  transition: all var(--transition);
}
.custom-input:focus {
  border-color: var(--accent-base);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.btn-primary-action {
  width: 100%;
  padding: 0.9rem 1.5rem;
  background: var(--accent-base);
  color: #ffffff;
  font-size: 0.95rem;
  font-weight: 700;
  border-radius: var(--radius-sm);
  letter-spacing: 0.01em;
  box-shadow: 0 4px 14px var(--accent-glow);
  gap: 0.5rem;
}
.btn-primary-action:hover {
  background: var(--accent-hover);
  transform: translateY(-1px);
}
.btn-primary-action:active {
  transform: scale(0.98);
}
.mode-picker-title {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-weight: 700;
  color: var(--text-tertiary);
  margin: 1.5rem 0 0.65rem;
  text-align: left;
}
.mode-picker {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.5rem;
  text-align: left;
  margin-bottom: 1.25rem;
}
.mode-option-card {
  padding: 0.75rem;
  border-radius: var(--radius-sm);
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  cursor: pointer;
  transition: all var(--transition);
}
.mode-option-card.active {
  border-color: var(--accent-base);
  background: var(--accent-soft);
}
.mode-option-card .mode-header {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  margin-bottom: 0.25rem;
}
.mode-option-card .mode-name {
  font-size: 0.82rem;
  font-weight: 700;
}
.mode-option-card .mode-desc {
  font-size: 0.7rem;
  color: var(--text-tertiary);
  line-height: 1.35;
}

/* ==========================================================================
   QUESTION CARD ARCHITECTURE (Doppelrand Style)
   ========================================================================== */
.question-envelope {
  margin-bottom: 1.25rem;
  border-radius: var(--radius-lg);
  border: 1px solid var(--border-subtle);
  background: var(--bg-card);
  padding: 1.25rem;
  position: relative;
  transition: all var(--transition);
}
.question-envelope:hover {
  border-color: var(--border-strong);
}
.question-envelope.is-flagged {
  border-color: var(--warning);
  background: linear-gradient(180deg, var(--warning-soft), var(--bg-card) 20%);
}
.question-envelope.is-answered {
  border-left: 3px solid var(--accent-base);
}
.q-header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
  margin-bottom: 0.85rem;
}
.q-badge-wrap {
  display: flex;
  align-items: center;
  gap: 0.45rem;
}
.q-idx-tag {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--accent-base);
  background: var(--accent-soft);
  padding: 0.2rem 0.55rem;
  border-radius: var(--radius-xs);
}
.q-task-tag {
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--text-tertiary);
}
.flag-btn {
  font-size: 0.74rem;
  color: var(--text-tertiary);
  padding: 0.25rem 0.5rem;
  border-radius: var(--radius-xs);
  gap: 0.35rem;
  transition: all var(--transition);
}
.flag-btn:hover, .flag-btn.active {
  color: var(--warning);
  background: var(--warning-soft);
}
.group-context-pill {
  display: flex;
  align-items: flex-start;
  gap: 0.4rem;
  padding: 0.55rem 0.85rem;
  background: var(--surface-secondary, rgba(255, 255, 255, 0.05));
  border-left: 3.5px solid var(--accent-base);
  border-radius: 6px;
  font-size: 0.84rem;
  font-weight: 600;
  color: var(--accent-base);
  margin-bottom: 0.85rem;
  line-height: 1.45;
}
.group-context-pill svg {
  flex-shrink: 0;
  margin-top: 2px;
}
.q-prompt-text {
  font-size: 0.96rem;
  font-weight: 600;
  color: var(--text-primary);
  line-height: 1.55;
  margin-bottom: 1rem;
}

/* PASSAGE INLINE DISPLAY (List Mode) */
.task-passage-container {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 1.25rem;
  margin-bottom: 1.25rem;
}
.task-passage-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 0.75rem;
  border-bottom: 1px solid var(--border-subtle);
  padding-bottom: 0.5rem;
}
.task-passage-title {
  font-family: var(--font-serif);
  font-size: 1.15rem;
  font-weight: 600;
  color: var(--text-primary);
}
.task-passage-content {
  font-family: var(--font-serif);
  font-size: 0.98rem;
  line-height: 1.85;
  color: var(--text-secondary);
  white-space: pre-line;
}
.task-passage-content mark, .task-passage-content b, .task-passage-content strong {
  background: var(--accent-soft);
  color: var(--accent-base);
  padding: 0.1rem 0.35rem;
  border-radius: var(--radius-xs);
  font-weight: 600;
}

/* ==========================================================================
   OPTIONS LIST (A, B, C, D)
   ========================================================================== */
.options-grid {
  display: flex;
  flex-direction: column;
  gap: 0.45rem;
}
.option-row {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.75rem 0.95rem;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-subtle);
  background: var(--bg-surface);
  cursor: pointer;
  transition: all var(--transition);
  text-align: left;
}
.option-row:hover {
  background: var(--bg-card-hover);
  border-color: var(--border-strong);
}
.option-row.selected {
  background: var(--accent-soft);
  border-color: var(--accent-base);
}
.opt-circle {
  width: 1.65rem;
  height: 1.65rem;
  border-radius: 50%;
  border: 1px solid var(--border-strong);
  background: var(--bg-surface-elevated);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.75rem;
  font-weight: 700;
  flex-shrink: 0;
  color: var(--text-secondary);
  transition: all var(--transition);
}
.option-row.selected .opt-circle {
  background: var(--accent-base);
  border-color: var(--accent-base);
  color: #ffffff;
}
.option-text {
  flex: 1;
  font-size: 0.9rem;
  line-height: 1.45;
  color: var(--text-primary);
}

/* ==========================================================================
   SENTENCE ORDER SPECIAL FEATURE (Live Paragraph Assembler)
   ========================================================================== */
.so-fragments-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 0.85rem 1rem;
  margin-bottom: 1rem;
}
.so-fragment-row {
  display: flex;
  align-items: flex-start;
  gap: 0.65rem;
  font-size: 0.86rem;
  line-height: 1.5;
  color: var(--text-secondary);
  margin-bottom: 0.5rem;
}
.so-fragment-row:last-child {
  margin-bottom: 0;
}
.so-tag {
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 0.72rem;
  color: var(--accent-base);
  background: var(--accent-soft);
  padding: 0.15rem 0.4rem;
  border-radius: var(--radius-xs);
  flex-shrink: 0;
  margin-top: 0.15rem;
}
.so-live-preview-box {
  margin-top: 0.85rem;
  padding: 0.85rem 1rem;
  border-radius: var(--radius-sm);
  background: var(--bg-surface-elevated);
  border: 1px dashed var(--border-accent);
}
.so-preview-header {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  font-size: 0.72rem;
  text-transform: uppercase;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--accent-base);
  margin-bottom: 0.4rem;
}
.so-preview-body {
  font-family: var(--font-serif);
  font-size: 0.94rem;
  line-height: 1.7;
  color: var(--text-primary);
  font-style: italic;
}

/* ==========================================================================
   WRITING SELF-CHECK ARCHITECTURE
   ========================================================================== */
.writing-container {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}
.writing-cue {
  font-family: var(--font-mono);
  font-size: 0.85rem;
  color: var(--accent-base);
  background: var(--accent-soft);
  padding: 0.5rem 0.75rem;
  border-radius: var(--radius-sm);
  border-left: 3px solid var(--accent-base);
}
.writing-textarea {
  width: 100%;
  min-height: 85px;
  padding: 0.85rem 1rem;
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-size: 0.92rem;
  line-height: 1.5;
  resize: vertical;
  outline: none;
  transition: all var(--transition);
}
.writing-textarea:focus {
  border-color: var(--accent-base);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.writing-tools {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 0.5rem;
}
.writing-word-count {
  font-size: 0.72rem;
  color: var(--text-tertiary);
  font-family: var(--font-mono);
}
.writing-compare-box {
  margin-top: 0.75rem;
  padding: 0.85rem 1rem;
  border-radius: var(--radius-sm);
  background: var(--bg-surface-elevated);
  border: 1px solid var(--border-subtle);
  display: none;
}
.writing-compare-box.active {
  display: block;
}
.model-ans-text {
  font-size: 0.88rem;
  color: var(--success);
  margin-top: 0.25rem;
  line-height: 1.5;
}
.self-grade-group {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  margin-top: 0.65rem;
}
.self-grade-btn {
  font-size: 0.74rem;
  font-weight: 600;
  padding: 0.3rem 0.65rem;
  border-radius: var(--radius-xs);
  border: 1px solid var(--border-subtle);
  color: var(--text-secondary);
}
.self-grade-btn.active {
  border-color: var(--success);
  background: var(--success-soft);
  color: var(--success);
}

/* ==========================================================================
   STICKY BOTTOM COMMAND BAR
   ========================================================================== */
.bottom-dock {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 35;
  background: var(--bg-surface);
  border-top: 1px solid var(--border-subtle);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  padding: 0.75rem 1rem calc(0.75rem + env(safe-area-inset-bottom, 0px));
}
.bottom-dock-inner {
  max-width: 900px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
}
.dock-nav-btn {
  padding: 0.65rem 1.15rem;
  border-radius: var(--radius-sm);
  background: var(--bg-surface-elevated);
  border: 1px solid var(--border-subtle);
  font-size: 0.84rem;
  font-weight: 600;
  color: var(--text-primary);
  gap: 0.45rem;
}
.dock-nav-btn:hover {
  border-color: var(--border-strong);
  transform: translateY(-1px);
}
.dock-nav-btn:disabled {
  opacity: 0.35;
  pointer-events: none;
}
.dock-center-meta {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.1rem;
}
.dock-counter {
  font-family: var(--font-mono);
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--text-primary);
}
.dock-matrix-trigger {
  font-size: 0.7rem;
  color: var(--accent-base);
  font-weight: 600;
  gap: 0.3rem;
}
.btn-submit-exam {
  padding: 0.65rem 1.35rem;
  border-radius: var(--radius-sm);
  background: var(--accent-base);
  color: #fff;
  font-size: 0.84rem;
  font-weight: 700;
  box-shadow: 0 4px 12px var(--accent-glow);
  gap: 0.45rem;
}
.btn-submit-exam:hover {
  background: var(--accent-hover);
}

/* ==========================================================================
   DRAWER: QUESTION MATRIX PALETTE
   ========================================================================== */
.sheet-backdrop {
  position: fixed;
  inset: 0;
  background: var(--sheet-scrim);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 50;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s var(--ease-smooth);
}
.sheet-backdrop.open {
  opacity: 1;
  pointer-events: auto;
}
.sheet-panel {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  max-width: 680px;
  margin: 0 auto;
  max-height: 85dvh;
  background: var(--bg-card);
  border-top: 1px solid var(--border-strong);
  border-radius: var(--radius-xl) var(--radius-xl) 0 0;
  z-index: 55;
  transform: translateY(100%);
  transition: transform 0.35s var(--ease-spring);
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow-lg);
}
.sheet-backdrop.open .sheet-panel {
  transform: translateY(0);
}
.sheet-header {
  padding: 1rem 1.25rem 0.75rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border-subtle);
}
.sheet-handle {
  width: 40px;
  height: 4px;
  background: var(--border-strong);
  border-radius: 999px;
  margin: 0.5rem auto 0;
}
.sheet-title {
  font-size: 1rem;
  font-weight: 700;
}
.sheet-body {
  padding: 1.25rem;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  flex: 1;
}
.matrix-legend {
  display: flex;
  align-items: center;
  justify-content: space-around;
  margin-bottom: 1.25rem;
  padding: 0.65rem;
  background: var(--bg-surface);
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-subtle);
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  font-size: 0.72rem;
  color: var(--text-secondary);
}
.legend-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}
.matrix-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(42px, 1fr));
  gap: 0.45rem;
}
.matrix-cell {
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.76rem;
  font-weight: 600;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-subtle);
  background: var(--bg-surface);
  color: var(--text-secondary);
  position: relative;
  transition: all var(--transition);
}
.matrix-cell:hover {
  transform: scale(1.08);
  border-color: var(--border-strong);
}
.matrix-cell.answered {
  background: var(--accent-soft);
  border-color: var(--accent-base);
  color: var(--accent-base);
}
.matrix-cell.flagged::after {
  content: '';
  position: absolute;
  top: 3px;
  right: 3px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--warning);
}
.matrix-cell.active-cur {
  box-shadow: 0 0 0 2px var(--text-primary);
}

/* ==========================================================================
   DRAWER: READING PASSAGE INSPECTOR
   ========================================================================== */
.passage-sheet-body {
  font-family: var(--font-serif);
  font-size: 1.05rem;
  line-height: 1.85;
  color: var(--text-primary);
  white-space: pre-line;
  padding: 1.5rem;
}
.passage-sheet-body mark {
  background: var(--accent-soft);
  color: var(--accent-base);
  padding: 0.1rem 0.4rem;
  border-radius: var(--radius-xs);
  font-weight: 600;
}

/* ==========================================================================
   RESULTS / REPORT SCREEN
   ========================================================================== */
.report-card {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-xl);
  padding: 2.25rem 1.75rem;
  text-align: center;
  box-shadow: var(--shadow-lg);
  margin-bottom: 2rem;
}
.score-radial {
  width: 140px;
  height: 140px;
  border-radius: 50%;
  border: 4px solid var(--accent-base);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  margin: 0 auto 1.5rem;
  background: var(--accent-soft);
}
.score-number {
  font-family: var(--font-mono);
  font-size: 2.8rem;
  font-weight: 800;
  line-height: 1;
}
.score-scale {
  font-size: 0.72rem;
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-top: 0.25rem;
}
.report-stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0.5rem;
  margin: 1.5rem 0;
}
.stat-box {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  padding: 0.75rem 0.5rem;
}
.stat-val {
  font-family: var(--font-mono);
  font-size: 1.25rem;
  font-weight: 700;
}
.stat-lbl {
  font-size: 0.68rem;
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-top: 0.2rem;
}

/* ==========================================================================
   ADMIN DASHBOARD ARCHITECTURE
   ========================================================================== */
.admin-card-wrap {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  overflow: hidden;
  margin-bottom: 1.5rem;
}
.admin-toolbar {
  padding: 1rem;
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  flex-wrap: wrap;
}
.search-input-wrap {
  position: relative;
  max-width: 280px;
  width: 100%;
}
.search-input-wrap .search-icon {
  position: absolute;
  left: 0.75rem;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-tertiary);
  pointer-events: none;
}
.search-input-wrap input {
  padding-left: 2.2rem;
}
.admin-table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
  font-size: 0.85rem;
}
.admin-table th {
  padding: 0.75rem 1rem;
  background: var(--bg-surface);
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-tertiary);
  border-bottom: 1px solid var(--border-subtle);
}
.admin-table td {
  padding: 0.85rem 1rem;
  border-bottom: 1px solid var(--border-subtle);
  color: var(--text-secondary);
}
.admin-table tr:hover td {
  background: var(--bg-surface);
  color: var(--text-primary);
}
.admin-table .student-name {
  font-weight: 600;
  color: var(--text-primary);
  cursor: pointer;
}
.admin-table .student-name:hover {
  color: var(--accent-base);
  text-decoration: underline;
}

/* RESPONSIVE TWEAKS */
@media (max-width: 600px) {
  .report-stats-grid {
    grid-template-columns: 1fr 1fr;
  }
  .app-header {
    padding: 0.5rem 0.75rem;
  }
  .brand-title {
    font-size: 0.8rem;
  }
}

/* REVIEW FILTER PILLS & STATUS BADGES */
.filter-pills-bar {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-bottom: 1.25rem;
  overflow-x: auto;
  scrollbar-width: none;
}
.filter-pill-btn {
  font-size: 0.78rem;
  font-weight: 600;
  padding: 0.4rem 0.85rem;
  border-radius: 999px;
  border: 1px solid var(--border-subtle);
  background: var(--bg-surface);
  color: var(--text-secondary);
  cursor: pointer;
  white-space: nowrap;
  transition: all var(--transition);
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
}
.filter-pill-btn:hover {
  border-color: var(--border-strong);
  color: var(--text-primary);
}
.filter-pill-btn.active {
  background: var(--accent-base);
  border-color: var(--accent-base);
  color: #fff;
}
.filter-pill-btn.active.filter-wrong {
  background: var(--danger);
  border-color: var(--danger);
}
.filter-pill-btn.active.filter-correct {
  background: var(--success);
  border-color: var(--success);
}
.opt-badge {
  font-size: 0.72rem;
  font-weight: 700;
  padding: 0.2rem 0.55rem;
  border-radius: var(--radius-xs);
  flex-shrink: 0;
  margin-left: auto;
}
.badge-good {
  background: var(--success);
  color: #fff;
}
.badge-bad {
  background: var(--danger);
  color: #fff;
}


/* ==========================================================================
   SUBJECT SELECTOR & CARDS (ANTI-OVERFLOW RESPONSIVE DESIGN)
   ========================================================================== */
.subject-picker-row {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 0.65rem;
  margin-bottom: 1.5rem;
}
.subject-picker-row .subject-pill-btn {
  display: grid;
  grid-template-columns: auto 1fr;
  grid-template-rows: auto auto;
  gap: 0.65rem 0.35rem;
  align-items: center;
  padding: 0.85rem 0.85rem;
  min-width: 0;
  min-height: 104px;
  box-sizing: border-box;
  border-radius: var(--radius-md);
  border: 2px solid var(--border-subtle);
  background: var(--bg-surface-elevated);
  transition: all var(--transition);
  cursor: pointer;
  text-align: left;
  overflow: hidden;
}
.subject-picker-row .subject-pill-btn:hover {
  border-color: var(--border-strong);
  transform: translateY(-2px);
  background: var(--bg-card-hover);
}
.subject-picker-row .subject-pill-btn.active {
  border-color: var(--accent-base);
  background: var(--accent-soft);
  box-shadow: 0 0 16px var(--accent-glow);
}
.subject-picker-row .subject-pill-btn .subject-icon-wrap {
  grid-column: 1;
  grid-row: 1;
  width: 36px;
  height: 36px;
  border-radius: var(--radius-sm);
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  color: var(--accent-base);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all var(--transition);
}
.subject-picker-row .subject-pill-btn.active .subject-icon-wrap {
  background: var(--accent-base);
  color: #ffffff;
  border-color: var(--accent-base);
  box-shadow: 0 2px 8px var(--accent-glow);
}
.subject-picker-row .subject-pill-btn .subject-pill-badge {
  grid-column: 2;
  grid-row: 1;
  justify-self: end;
  font-size: 0.7rem;
  font-weight: 700;
  padding: 0.18rem 0.5rem;
  border-radius: 999px;
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  color: var(--text-secondary);
  white-space: nowrap;
}
.subject-picker-row .subject-pill-btn.active .subject-pill-badge {
  background: var(--accent-base);
  color: #fff;
  border-color: var(--accent-base);
}
.subject-picker-row .subject-pill-btn .subject-info-wrap {
  grid-column: 1 / span 2;
  grid-row: 2;
  width: 100%;
  min-width: 0;
  overflow: hidden;
}
.subject-picker-row .subject-pill-btn .subject-title {
  font-size: 0.92rem;
  font-weight: 700;
  color: var(--text-primary);
  display: block;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 0.15rem;
}
.subject-picker-row .subject-pill-btn .subject-subtitle {
  font-size: 0.72rem;
  color: var(--text-tertiary);
  display: block;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Modal subject pills keep horizontal flex layout */
.subject-pill-btn {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.85rem 1rem;
  border-radius: var(--radius-md);
  border: 2px solid var(--border-subtle);
  background: var(--bg-surface-elevated);
  transition: all var(--transition);
  cursor: pointer;
  text-align: left;
}
.subject-pill-btn:hover {
  border-color: var(--border-strong);
  transform: translateY(-2px);
  background: var(--bg-card-hover);
}
.subject-pill-btn.active {
  border-color: var(--accent-base);
  background: var(--accent-soft);
  box-shadow: 0 0 16px var(--accent-glow);
}
.subject-icon-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  border-radius: var(--radius-sm);
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  color: var(--accent-base);
  flex-shrink: 0;
  transition: all var(--transition);
}
.subject-icon-wrap svg {
  width: 22px;
  height: 22px;
}
.subject-pill-btn.active .subject-icon-wrap {
  background: var(--accent-base);
  color: #ffffff;
  border-color: var(--accent-base);
  box-shadow: 0 2px 8px var(--accent-glow);
}

@media (max-width: 580px) {
  .welcome-container {
    margin: 1.25rem auto;
    padding: 0 0.25rem;
  }
  .welcome-card {
    padding: 1.5rem 1rem;
  }
  .subject-picker-row {
    grid-template-columns: 1fr;
    gap: 0.55rem;
  }
  .subject-picker-row .subject-pill-btn {
    grid-template-columns: auto 1fr auto;
    grid-template-rows: auto;
    gap: 0.75rem;
    padding: 0.75rem 0.95rem;
    min-height: auto;
  }
  .subject-picker-row .subject-pill-btn .subject-icon-wrap {
    grid-column: 1;
    grid-row: 1;
  }
  .subject-picker-row .subject-pill-btn .subject-info-wrap {
    grid-column: 2;
    grid-row: 1;
  }
  .subject-picker-row .subject-pill-btn .subject-pill-badge {
    grid-column: 3;
    grid-row: 1;
    justify-self: end;
  }
}
.opt-badge svg {
  width: 12px;
  height: 12px;
  margin-right: 0.3rem;
  vertical-align: -1px;
}
.sub-badge svg {
  width: 13px;
  height: 13px;
  vertical-align: -2px;
}
.subject-pill-left {
  display: flex;
  align-items: center;
  gap: 0.65rem;
}
.subject-emoji {
  font-size: 1.45rem;
  line-height: 1;
}
.subject-title {
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--text-primary);
  display: block;
}
.subject-subtitle {
  font-size: 0.72rem;
  color: var(--text-tertiary);
  display: block;
}
.subject-pill-badge {
  font-size: 0.72rem;
  font-weight: 700;
  padding: 0.2rem 0.55rem;
  border-radius: 999px;
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  color: var(--text-secondary);
}
.subject-pill-btn.active .subject-pill-badge {
  background: var(--accent-base);
  color: #fff;
  border-color: var(--accent-base);
}

/* TOP HEADER SUBJECT TOGGLE BADGE */
.subject-toggle-badge {
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  transition: all var(--transition);
  user-select: none;
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  padding: 0.28rem 0.6rem;
  border-radius: var(--radius-xs);
  text-transform: uppercase;
  color: #ffffff;
}
.subject-toggle-badge:hover {
  transform: translateY(-1px);
  filter: brightness(1.15);
}
.subject-toggle-badge:active {
  transform: scale(0.96);
}
.subject-toggle-badge.subject-physics {
  background: #0ea5e9;
}
.subject-toggle-badge.subject-history {
  background: #e11d48;
}
.subject-toggle-badge.subject-english {
  background: var(--accent-base);
}

/* SUBJECT MODAL DIALOG */
.subject-switch-dialog {
  background: var(--bg-card);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-lg);
  padding: 1.5rem;
  max-width: 440px;
  width: 90%;
  margin: 15vh auto;
  box-shadow: var(--shadow-lg);
}

/* IMAGE DISPLAY & ZOOM MODAL */
.q-image-card {
  margin: 0.85rem 0 1.15rem;
  border-radius: var(--radius-md);
  background: var(--bg-surface-elevated);
  border: 1px solid var(--border-subtle);
  overflow: hidden;
  cursor: zoom-in;
  transition: all var(--transition);
}
.q-image-card:hover {
  border-color: var(--accent-base);
  box-shadow: var(--shadow-sm);
}
.q-image-wrapper {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 1rem;
  background: rgba(0,0,0,0.18);
}
.q-image {
  max-width: 100%;
  max-height: 280px;
  object-fit: contain;
  border-radius: var(--radius-xs);
  display: block;
}
.q-image-zoom-tag {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.35rem;
  padding: 0.4rem 0.75rem;
  background: var(--bg-surface);
  border-top: 1px solid var(--border-subtle);
  font-size: 0.75rem;
  color: var(--text-tertiary);
  font-weight: 600;
}
.q-image-card:hover .q-image-zoom-tag {
  color: var(--accent-base);
}

/* ==========================================================================
   TRUE / FALSE (ĐÚNG / SAI) INTERACTIVE WIDGET STYLES
   ========================================================================== */
.tf-container {
  margin-top: 1.25rem;
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}
.tf-instruction-tag {
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--accent-base);
  background: var(--accent-soft);
  border: 1px solid var(--border-accent);
  padding: 0.45rem 0.85rem;
  border-radius: var(--radius-sm);
  margin-bottom: 0.25rem;
  width: fit-content;
}
.tf-instruction-tag svg {
  width: 15px;
  height: 15px;
  flex-shrink: 0;
}
.tf-items-list {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}
.tf-item-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  padding: 0.85rem 1.1rem;
  border-radius: var(--radius-md);
  border: 1.5px solid var(--border-subtle);
  background: var(--bg-surface);
  transition: all var(--transition);
}
.tf-item-card:hover {
  border-color: var(--border-strong);
  background: var(--bg-surface-elevated);
}
.tf-item-card.answered {
  border-color: var(--accent-base);
  background: var(--bg-card);
}
.tf-item-content {
  display: flex;
  align-items: flex-start;
  gap: 0.75rem;
  flex: 1;
}
.tf-item-badge {
  font-family: var(--font-mono);
  font-size: 0.85rem;
  font-weight: 800;
  color: var(--accent-base);
  padding: 0.15rem 0.5rem;
  border-radius: var(--radius-xs);
  background: var(--accent-soft);
  flex-shrink: 0;
  margin-top: 0.1rem;
}
.tf-item-text {
  font-size: 0.92rem;
  line-height: 1.55;
  color: var(--text-primary);
  font-weight: 500;
}
.tf-btn-group {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  flex-shrink: 0;
}
.tf-choice-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.35rem;
  min-width: 82px;
  padding: 0.45rem 0.85rem;
  font-size: 0.8rem;
  font-weight: 700;
  border-radius: var(--radius-sm);
  border: 1.5px solid var(--border-subtle);
  background: var(--bg-surface-elevated);
  color: var(--text-secondary);
  cursor: pointer;
  transition: all var(--transition);
  user-select: none;
}
.tf-choice-btn svg {
  width: 14px;
  height: 14px;
}
.tf-choice-btn:hover {
  transform: translateY(-1px);
}
.tf-choice-btn.btn-true:hover {
  border-color: #16a34a;
  color: #16a34a;
}
.tf-choice-btn.btn-false:hover {
  border-color: #dc2626;
  color: #dc2626;
}
.tf-choice-btn.btn-true.active {
  background: #16a34a;
  border-color: #16a34a;
  color: #ffffff;
  box-shadow: 0 2px 8px rgba(22, 163, 74, 0.35);
}
.tf-choice-btn.btn-false.active {
  background: #dc2626;
  border-color: #dc2626;
  color: #ffffff;
  box-shadow: 0 2px 8px rgba(220, 38, 38, 0.35);
}

@media (max-width: 600px) {
  .tf-item-card {
    flex-direction: column;
    align-items: stretch;
    gap: 0.75rem;
    padding: 0.75rem 0.85rem;
  }
  .tf-btn-group {
    justify-content: flex-end;
    width: 100%;
  }
  .tf-choice-btn {
    flex: 1;
    min-width: 0;
    padding: 0.55rem;
  }
}

/* TRUE / FALSE REVIEW STYLES */
.review-tf-container {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
  margin: 0.85rem 0;
}
.review-tf-row {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  padding: 0.75rem 1rem;
  transition: all var(--transition);
}
.review-tf-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 0.75rem;
  margin-bottom: 0.45rem;
}
.review-tf-text {
  font-size: 0.9rem;
  line-height: 1.55;
  color: var(--text-primary);
  font-weight: 500;
  flex: 1;
}
.review-tf-verdict {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 1rem;
  font-size: 0.8rem;
  padding-top: 0.45rem;
  border-top: 1px dashed var(--border-subtle);
}

/* IMAGE ZOOM MODAL */
.image-modal-backdrop {
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
}
.image-modal-dialog {
  background: var(--bg-card);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-lg);
  max-width: 92vw;
  max-height: 90vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 24px 64px rgba(0,0,0,0.65);
}
.image-modal-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.75rem 1.25rem;
  border-bottom: 1px solid var(--border-subtle);
  background: var(--bg-surface);
}
.image-modal-title {
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--text-secondary);
}
.image-modal-body {
  padding: 1rem;
  overflow: auto;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #000000;
}
.image-modal-body img {
  max-width: 100%;
  max-height: 75vh;
  object-fit: contain;
}

/* KATEX MATH FORMULA STYLING */
.katex {
  font-size: 1.05em !important;
  text-rendering: auto;
}
.katex-display-wrap {
  display: block;
  overflow-x: auto;
  overflow-y: hidden;
  padding: 0.4rem 0;
  margin: 0.35rem 0;
  text-align: center;
}
.katex-display-wrap .katex-display {
  margin: 0 !important;
}

/* EXPLANATION BOX */
.q-explanation-box {
  margin-top: 0.85rem;
  padding: 0.75rem 1rem;
  background: var(--accent-soft);
  border: 1px solid var(--border-accent);
  border-radius: var(--radius-sm);
  font-size: 0.85rem;
  line-height: 1.6;
}
.q-explanation-header {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  font-weight: 700;
  font-size: 0.78rem;
  color: var(--accent-base);
  margin-bottom: 0.35rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.q-explanation-body {
  color: var(--text-primary);
}

/* SUBJECT BADGES IN LISTS & TABLES */
.sub-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
  font-size: 0.7rem;
  font-weight: 700;
  padding: 0.15rem 0.5rem;
  border-radius: 999px;
  vertical-align: middle;
}
.sub-badge-english {
  background: rgba(79, 120, 255, 0.15);
  color: #4f78ff;
  border: 1px solid rgba(79, 120, 255, 0.3);
}
.sub-badge-history {
  background: rgba(225, 29, 72, 0.14);
  color: #f43f5e;
  border: 1px solid rgba(225, 29, 72, 0.3);
}
.sub-badge-physics {
  background: rgba(14, 165, 233, 0.15);
  color: #0ea5e9;
  border: 1px solid rgba(14, 165, 233, 0.3);
}

/* ==========================================================================
   COMPACT SCOPE SELECTOR DROPDOWN (ULTRA CLEAN & NO CLUTTER)
   ========================================================================== */
.scope-dropdown-group {
  text-align: left;
  margin-bottom: 1.25rem;
}
.select-wrapper {
  position: relative;
  width: 100%;
}
.custom-select {
  width: 100%;
  padding: 0.85rem 2.5rem 0.85rem 1rem;
  background: var(--bg-surface);
  border: 1.5px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-size: 0.92rem;
  font-weight: 600;
  appearance: none;
  -webkit-appearance: none;
  cursor: pointer;
  outline: none;
  transition: all var(--transition);
}
.custom-select:hover {
  border-color: var(--border-strong);
  background: var(--bg-card-hover);
}
.custom-select:focus {
  border-color: var(--accent-base);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.custom-select option {
  background: var(--bg-card);
  color: var(--text-primary);
  padding: 0.5rem;
}
.select-arrow {
  position: absolute;
  right: 1rem;
  top: 50%;
  transform: translateY(-50%);
  pointer-events: none;
  color: var(--text-tertiary);
  display: flex;
  align-items: center;
}
</style>
</head>
<body>

<!-- ==========================================================================
     APP HEADER
     ========================================================================== -->
<header class="app-header">
  <div class="app-header-inner">
    <div class="brand-group">
      <button class="subject-toggle-badge subject-english" id="topSubjectBadge" onclick="showSubjectSwitchModal()" title="Nhấp để đổi môn học (Tiếng Anh 11 ↔ Vật Lí 11)">
        <span id="topSubjectCode">ENG 11</span>
        <svg class="v-icon" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <span class="brand-title" id="topHeaderTitle">THPT Vĩnh Thuận</span>
    </div>
    
    <div class="header-actions">
      <!-- Live Timer -->
      <div class="timer-chip" id="timerChip" style="display:none;">
        <span class="timer-indicator"></span>
        <span id="timerDisplay">00:00</span>
      </div>
      
      <!-- Theme Switcher with Vector Icon -->
      <button class="icon-btn" id="btnThemeToggle" onclick="cycleTheme()" title="Đổi giao diện (Dark / Light / Sepia)">
        <!-- Injected by JS -->
      </button>
      
            <!-- Force Refresh & Update Button -->
      <button class="icon-btn" onclick="forceAppRefresh()" title="Tải phiên bản mới nhất (Làm mới cache)">
        <svg class="v-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>

      <!-- History Button -->

        <svg class="v-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      </button>

      <!-- Question Matrix Button -->
      <button class="icon-btn" id="btnMatrixTrigger" onclick="openMatrixSheet()" style="display:none;" title="Bảng ma trận câu hỏi">
        <svg class="v-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
      </button>
      
      <!-- Admin Button -->
      <button class="icon-btn" onclick="showAdminView()" title="Bảng quản trị giáo viên">
        <svg class="v-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>
  </div>
</header>

<!-- PROGRESS STRIP -->
<div class="progress-strip" id="progressStrip" style="display:none;">
  <div class="progress-strip-fill" id="progressFill"></div>
</div>

     SECTION TABS BAR

  <div class="section-tabs" id="sectionTabs">
    <!-- Populated by JS -->
  </div>
</nav>

<!-- ==========================================================================
     VIEW MODE TOGGLE BAR
     ========================================================================== -->
<div class="mode-toggle-bar" id="modeToggleBar" style="display:none;">
  <div class="view-mode-pill">
    <button class="view-mode-btn" id="btnModeFocus" onclick="switchViewMode('focus')">Từng câu (Focus)</button>
    <button class="view-mode-btn active" id="btnModeList" onclick="switchViewMode('list')">Danh sách (Cuộn)</button>
  </div>
  
  <button class="passage-drawer-btn" id="btnOpenPassage" onclick="openPassageSheet()" style="display:none;">

     MAIN VIEWPORT
     ========================================================================== -->
<main class="main-viewport" id="mainViewport">
  <!-- Dynamic Views Injected Here -->
</main>

<!-- ==========================================================================
     BOTTOM COMMAND DOCK
     ========================================================================== -->
<div class="bottom-dock" id="bottomDock" style="display:none;">
  <div class="bottom-dock-inner">
    <button class="dock-nav-btn" id="btnPrev" onclick="navigateQuestion(-1)">
      <svg class="v-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      <span>Câu trước</span>
    </button>
    
    <div class="dock-center-meta">
      <span class="dock-counter" id="dockCounter">1 / 89</span>
      <button class="dock-matrix-trigger" onclick="openMatrixSheet()">
        <svg class="v-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
        <span>Bảng câu hỏi</span>
      </button>
    </div>
    
    <button class="dock-nav-btn" id="btnNext" onclick="navigateQuestion(1)">
      <span>Câu sau</span>
      <svg class="v-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
    </button>
    
    <button class="btn-submit-exam" id="btnSubmitQuick" onclick="confirmSubmitExam()">
      <svg class="v-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      <span>Nộp bài</span>
    </button>
  </div>
</div>

<!-- ==========================================================================
     SHEET MODAL: QUESTION MATRIX
     ========================================================================== -->
<div class="sheet-backdrop" id="matrixSheet" onclick="closeMatrixSheet(event)">
  <div class="sheet-panel" onclick="event.stopPropagation()">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <h3 class="sheet-title">Ma Trận Câu Hỏi</h3>
      <button class="icon-btn" onclick="closeMatrixSheet()">
        <svg class="v-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    
    <div class="sheet-body">
      <div class="matrix-legend">
        <div class="legend-item"><span class="legend-dot" style="background:var(--border-strong);"></span> Chưa làm</div>
        <div class="legend-item"><span class="legend-dot" style="background:var(--accent-base);"></span> Đã làm</div>
        <div class="legend-item"><span class="legend-dot" style="background:var(--warning);"></span> Đánh dấu</div>
      </div>
      
      <div class="matrix-grid" id="matrixGrid">
        <!-- Rendered by JS -->
      </div>
    </div>
  </div>
</div>

<!-- ==========================================================================
     SHEET MODAL: READING PASSAGE
     ========================================================================== -->
<div class="sheet-backdrop" id="passageSheet" onclick="closePassageSheet(event)">
  <div class="sheet-panel" onclick="event.stopPropagation()">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <h3 class="sheet-title" id="passageSheetTitle">Nội dung bài đọc</h3>
      <button class="icon-btn" onclick="closePassageSheet()">
        <svg class="v-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <div class="sheet-body passage-sheet-body" id="passageSheetBody">
      <!-- Injected by JS -->

  </div>
</div>

<!-- ==========================================================================
     SHEET MODAL: STUDENT ATTEMPT DETAIL (Admin)
     ========================================================================== -->

  <div class="sheet-panel" onclick="event.stopPropagation()">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <h3 class="sheet-title" id="studentDetailTitle">Chi tiết bài làm</h3>
      <button class="icon-btn" onclick="closeStudentDetailSheet()">
        <svg class="v-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="studentDetailBody">
      <!-- Injected by JS -->
    </div>
  </div>
</div>

<!-- ==========================================================================
     SHEET MODAL: HISTORY DRAWER
     ========================================================================== -->
<div class="sheet-backdrop" id="historySheet" onclick="closeHistorySheet(event)">
  <div class="sheet-panel" onclick="event.stopPropagation()">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <div style="display:flex;align-items:center;gap:0.4rem;">
        <svg class="v-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <h3 class="sheet-title">Lịch Sử Làm Bài Của Bạn</h3>
      </div>
      <button class="icon-btn" onclick="closeHistorySheet()">
        <svg class="v-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="historySheetBody">
      <!-- Injected by JS -->
    </div>
  </div>
</div>


<!-- ==========================================================================
     SHEET MODAL: IMAGE ZOOM MODAL
     ========================================================================== -->
<div class="sheet-backdrop image-modal-backdrop" id="imageZoomModal" onclick="closeImageModal(event)">
  <div class="image-modal-dialog" onclick="event.stopPropagation()">
    <div class="image-modal-top">
      <span class="image-modal-title">Hình ảnh minh họa câu hỏi</span>
      <button class="icon-btn" onclick="closeImageModal()">
        <svg class="v-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>

function findQuestionById(qid, preferredSubject = AppState.currentSubject) {
  let found = FlatQuestions.find(q => q.id === qid);
  if (found) return found;
  
  const sets = [
    { data: window.HISTORY_QUIZ_DATA || [], sub: "history" },
    { data: window.PHYSICS_QUIZ_DATA || [], sub: "physics" },
    { data: window.QUIZ_DATA || [], sub: "english" }
  ];
  
  // Sort preferred first
  sets.sort((a, b) => (a.sub === preferredSubject ? -1 : (b.sub === preferredSubject ? 1 : 0)));
    
  for (const item of sets) {
    for (const sec of item.data) {
      for (const task of (sec.tasks || [])) {
        for (const q of (task.questions || [])) {
          if (q.id === qid) {
            return {
              ...q,
              subject: item.sub,
              sectionId: sec.id,
              sectionTitle: sec.title || sec.name,
              taskName: task.name,
              taskTitle: task.title,
              passage: task.passage
            };
          }
        }
      }
    }
  }
  return null;
}

/* ==========================================================================
   KATEX MATH FORMULA PARSER & RENDERER
   ========================================================================== */
function renderMathAndText(str) {
  if (!str) return "";
  if (typeof str !== "string") str = String(str);
  
  if (window.katex) {
    const mathRegex = /(\$\$[\s\S]+?\$\$|\\\[[\s\S]+?\\\]|\\\([\s\S]+?\\\)|\$[^\$\n\r]+?\$)/g;
    const parts = str.split(mathRegex);
    let result = "";
    
    for (let i = 0; i < parts.length; i++) {
      const part = parts[i];
      if (!part) continue;
      
      if ((part.startsWith("$$") && part.endsWith("$$") && part.length >= 4) ||
          (part.startsWith("\\[") && part.endsWith("\\]") && part.length >= 4)) {
        const expr = part.slice(2, -2).trim();
        try {
          result += '<span class="katex-display-wrap">' + window.katex.renderToString(expr, { displayMode: true, throwOnError: false }) + '</span>';
        } catch(e) {
          result += escapeHtml(part);
        }
      } else if (part.startsWith("\\(") && part.endsWith("\\)") && part.length >= 4) {
        const expr = part.slice(2, -2).trim();
        try {
          result += window.katex.renderToString(expr, { displayMode: false, throwOnError: false });
        } catch(e) {
          result += escapeHtml(part);
        }
      } else if (part.startsWith("$") && part.endsWith("$") && part.length >= 2) {
        const expr = part.slice(1, -1).trim();
        try {
          result += window.katex.renderToString(expr, { displayMode: false, throwOnError: false });
        } catch(e) {
          result += escapeHtml(part);
        }
      } else {
        result += escapeHtml(part);
      }
    }
    return result;
  }
  
  return escapeHtml(str);
}

function triggerMathTypesetting(element) {
  if (window.renderMathInElement && element) {
    try {
      window.renderMathInElement(element, {
        delimiters: [
          { left: "$$", right: "$$", display: true },
          { left: "\\[", right: "\\]", display: true },
          { left: "\\(", right: "\\)", display: false },
          { left: "$", right: "$", display: false }
        ],
        throwOnError: false
      });
    } catch(e) {}
  }
}

function ensureRecordHydratedAndRegraded(rec) {
  if (!rec || !Array.isArray(rec.breakdown)) return rec;
  if (!rec.subject) {
    rec.subject = "english";
    rec.subjectName = "Tiếng Anh 11";
  }
  const letters = ['A', 'B', 'C', 'D'];
  let modified = false;
  
  rec.breakdown = rec.breakdown.map(item => {
    const orig = findQuestionById(item.id, rec.subject);
    let updatedItem = { ...item };
    
    if (orig) {
      updatedItem.options = (orig.options && orig.options.length) ? orig.options : item.options;
      updatedItem.sentences = (orig.sentences && Object.keys(orig.sentences).length) ? orig.sentences : item.sentences;
      updatedItem.passage = orig.passage || item.passage;
      updatedItem.taskName = orig.taskName || item.taskName;
      updatedItem.taskTitle = orig.taskTitle || item.taskTitle;
      updatedItem.sectionTitle = orig.sectionTitle || item.sectionTitle;
      updatedItem.cue = orig.cue || item.cue;
      updatedItem.model_answer = orig.model_answer || item.model_answer;
      updatedItem.acceptable = orig.acceptable || item.acceptable;
      updatedItem.explanation = orig.explanation || item.explanation;
      updatedItem.image = orig.image || item.image;
      if (orig.answer !== undefined) {
        updatedItem.correctAnswerIdx = orig.answer;
        updatedItem.correctLetter = letters[orig.answer];
      }
    }
    
    if (updatedItem.userChoiceIdx === undefined && typeof updatedItem.userChoice === "string") {
      const uIdx = letters.indexOf(updatedItem.userChoice.trim().toUpperCase());
      if (uIdx !== -1) updatedItem.userChoiceIdx = uIdx;
    }
    if (updatedItem.userChoice === undefined && updatedItem.userChoiceIdx !== undefined && updatedItem.userChoiceIdx !== null) {
      updatedItem.userChoice = letters[updatedItem.userChoiceIdx];
    }
    
    if (updatedItem.isWriting || orig?.model_answer) {
      updatedItem.isWriting = true;
      const userText = updatedItem.userAns || "";
      const targetQ = orig || updatedItem;
      const autoRes = gradeWritingAnswer(userText, targetQ);
      
      if ((!updatedItem.score || updatedItem.score === 0 || !updatedItem.isCorrect) && autoRes.score > 0) {
        updatedItem.score = autoRes.score;
        updatedItem.isCorrect = autoRes.isCorrect;
        updatedItem.feedback = autoRes.feedback;
        modified = true;
      }
    }
    
    return updatedItem;
  });
  
  let writingScore = 0;
  let writingMax = 0;
  let correctMCQ = 0;
  let totalMCQ = 0;
  let tfScore = 0;
  let tfMax = 0;

  rec.breakdown.forEach(item => {
    if (item.isTrueFalse || item.type === 'true_false') {
      tfMax += 1.0;
      tfScore += (item.score || 0);
    } else if (item.isWriting) {
      writingMax += 1;
      writingScore += (item.score || 0);
    } else {
      totalMCQ += 1;
      if (item.isCorrect) correctMCQ += 1;
    }
  });

  rec.writingScore = writingScore;
  rec.writingMax = writingMax;
  rec.correctMCQ = correctMCQ;
  rec.totalMCQ = totalMCQ;
  rec.tfScore = tfScore;
  rec.tfMax = tfMax;

  const totalWeight = totalMCQ + writingMax + tfMax;
  const earnedWeight = correctMCQ + writingScore + tfScore;
  rec.grade10 = totalWeight > 0 ? Math.round((earnedWeight / totalWeight) * 10 * 10) / 10 : 0;

  return rec;
}

        subject: r.subject || "english",
        subjectName: r.subjectName || (r.subject === "physics" ? "Vật Lí 11" : "Tiếng Anh 11")
      }));
      localStorage.setItem(SUBMISSIONS_KEY, JSON.stringify(list));
    }
    return list;
  } catch(e) {
    return [];
  }
}

function saveStudentSubmission(record) {
  try {
    const list = getAllSubmissions();
    list.unshift(record);
    localStorage.setItem(SUBMISSIONS_KEY, JSON.stringify(list));
    if (record.subject === "english") {
      const leg = JSON.parse(localStorage.getItem(LEGACY_SUBMISSIONS_KEY) || "[]");
      leg.unshift(record);
      localStorage.setItem(LEGACY_SUBMISSIONS_KEY, JSON.stringify(leg));
    }
  } catch(e) {
    console.error("Failed to save submission", e);
  }
}

function migrateSubmissionsData() {
  try {
    const list = getAllSubmissions();
    if (!list || !list.length) return;
    
    list.forEach(rec => {
      ensureRecordHydratedAndRegraded(rec);
    });
    
    localStorage.setItem(SUBMISSIONS_KEY, JSON.stringify(list));
  } catch(e) {
    console.error("Migration error:", e);
  }
}

// ==========================================================================
// AUDIO & HAPTIC FEEDBACK (Web Audio API)
// ==========================================================================
const AudioFX = {
  ctx: null,
  init() {
    if (!this.ctx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) this.ctx = new AudioContext();
    }
  },
  tap() {
    if (!this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(440, this.ctx.currentTime);
      gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.06);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.06);
    } catch(e){}
  },
  success() {
    if (!this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(523.25, this.ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(659.25, this.ctx.currentTime + 0.12);
      gain.gain.setValueAtTime(0.06, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.2);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.2);
    } catch(e){}
  }
};

// ==========================================================================
// TIMER MANAGEMENT
// ==========================================================================
function startTimer() {
  if (AppState.timerInterval) clearInterval(AppState.timerInterval);
  if (!AppState.startTime) AppState.startTime = Date.now() - (AppState.elapsedSeconds * 1000);
  
  document.getElementById("timerChip").style.display = "inline-flex";
  
  AppState.timerInterval = setInterval(() => {
    AppState.elapsedSeconds = Math.floor((Date.now() - AppState.startTime) / 1000);
    const m = Math.floor(AppState.elapsedSeconds / 60).toString().padStart(2, '0');
    const s = (AppState.elapsedSeconds % 60).toString().padStart(2, '0');
    document.getElementById("timerDisplay").textContent = `${m}:${s}`;
    saveSessionDebounced();
  }, 1000);
}

function stopTimer() {
  if (AppState.timerInterval) {
    clearInterval(AppState.timerInterval);
    AppState.timerInterval = null;
  }
}

// ==========================================================================
// SESSION PERSISTENCE (Autosave per subject)
// ==========================================================================
let saveTimeout = null;
function saveSessionDebounced() {
  if (saveTimeout) clearTimeout(saveTimeout);
  saveTimeout = setTimeout(() => {
    if (!AppState.isFinished && AppState.studentName) {
      const payload = {
        subject: AppState.currentSubject,
        studentName: AppState.studentName,
        practiceMode: AppState.practiceMode,
        viewMode: AppState.viewMode,
        activeQuestionGlobalIdx: AppState.activeQuestionGlobalIdx,
        userAnswers: AppState.userAnswers,
        selfGrades: AppState.selfGrades,
        flaggedQuestions: Array.from(AppState.flaggedQuestions),
        elapsedSeconds: AppState.elapsedSeconds,
        timestamp: Date.now()
      };
      localStorage.setItem(getActiveSessionKey(), JSON.stringify(payload));

      // Telemetry Live Update (Provisional Scoring & Realtime Telemetry)
      if (window.Telemetry && typeof Telemetry.updateProgress === "function") {
        try {
          const subset = getActiveQuestionsSubset();
          const prov = Telemetry.calculateProvisionalScore(subset, AppState.userAnswers);
          const curQ = subset[AppState.activeQuestionGlobalIdx] || {};
          Telemetry.updateProgress({
            studentName: AppState.studentName,
            subject: AppState.currentSubject,
            subjectName: (AppState.currentSubject === "history" ? "Lịch Sử 11" : (AppState.currentSubject === "physics" ? "Vật Lí 11" : "Tiếng Anh 11")),
            practiceMode: AppState.practiceMode,
            totalCount: subset.length,
            answeredCount: prov.answered,
            provisionalScore: prov.earnedWeight,
            provisionalGrade10: prov.grade10,
            correctCount: prov.correct,
            wrongCount: prov.wrong,
            progressPct: prov.progressPct,
            currentQuestionGlobalIdx: AppState.activeQuestionGlobalIdx,
            currentQuestionLabel: curQ.label || `Câu ${AppState.activeQuestionGlobalIdx + 1}`,
            elapsedSeconds: AppState.elapsedSeconds,
            userAnswers: AppState.userAnswers
          });
        } catch(te) {
          console.warn("[Telemetry] Error updating progress", te);
        }
      }
    }
  }, 400);
}

function loadSavedSession() {
  try {
    const key = getActiveSessionKey();
    let raw = localStorage.getItem(key);
    if (!raw && AppState.currentSubject === "english") {
      raw = localStorage.getItem("eng11_thpt_vinhtuan_active_session");
    }
    if (!raw) return null;
    const data = JSON.parse(raw);
    if (Date.now() - data.timestamp > 48 * 3600 * 1000) {
      localStorage.removeItem(key);
      return null;
    }
    return data;
  } catch(e) {
    return null;
  }
}

function clearSession() {
  localStorage.removeItem(getActiveSessionKey());
  if (AppState.currentSubject === "english") {
    localStorage.removeItem("eng11_thpt_vinhtuan_active_session");
  }
}

function getActiveQuestionsSubset() {
  if (AppState.practiceMode === "full") return FlatQuestions;

  const byTask = FlatQuestions.filter(q => q.taskId === AppState.practiceMode);
  if (byTask.length > 0) return byTask;
  return FlatQuestions;
}

  let html = `<button class="sec-tab ${AppState.activeSectionIdx === -1 ? 'active' : ''}" onclick="filterSection(-1)">Tất cả <span class="tab-badge">${FlatQuestions.length}</span></button>`;
  
  if (AppState.currentSubject === 'english') {
    quizData.forEach((sec, idx) => {
      const qCount = FlatQuestions.filter(q => q.sectionId === sec.id).length;
      const isAct = (AppState.activeSectionIdx === idx);
      const shortTitle = sec.title.includes(":") ? sec.title.split(":")[0] : sec.title;
      html += `
        <button class="sec-tab ${isAct ? 'active' : ''}" onclick="filterSection(${idx})">
          ${escapeHtml(shortTitle)} <span class="tab-badge">${qCount}</span>
        </button>
      `;
    });
  } else {
    let itemIdx = 0;
    quizData.forEach(sec => {
      (sec.tasks || []).forEach(t => {
        const qCount = (t.questions || []).length;
        const isAct = (AppState.activeSectionIdx === itemIdx);
        const shortName = t.name.includes(":") ? t.name.split(":")[0] : t.name;
        const curIdx = itemIdx;
        html += `
          <button class="sec-tab ${isAct ? 'active' : ''}" onclick="filterSection(${curIdx})">
            ${escapeHtml(shortName)} <span class="tab-badge">${qCount}</span>
          </button>
        `;
        itemIdx++;
      });
    });
  }
  
  tabsContainer.innerHTML = html;
}

function filterSection(secIdx) {
  AudioFX.init();
  AudioFX.tap();
  AppState.activeSectionIdx = secIdx;
  renderSectionTabs();
  
  const subset = getActiveQuestionsSubset();
  const quizData = getCurrentQuizData();
  
  if (secIdx >= 0) {
    let targetQ = null;
    if (AppState.currentSubject === 'english') {
      if (quizData[secIdx]) {
        const secId = quizData[secIdx].id;
        targetQ = subset.find(q => q.sectionId === secId);
      }
    } else {
      let cur = 0;
      for (const s of quizData) {
        for (const t of (s.tasks || [])) {
          if (cur === secIdx) {
            targetQ = subset.find(q => q.taskId === t.id);
            break;
          }
          cur++;
        }
        if (targetQ) break;
      }
    }
    
    if (targetQ) {
      AppState.activeQuestionGlobalIdx = targetQ.globalIdx;
    }
  }
  
  if (AppState.viewMode === "focus") {
    renderFocusMode();
  } else {
    renderListMode();
    if (secIdx >= 0) {
      const el = document.getElementById(`sec-heading-${secIdx}`);
      if (el) el.scrollIntoView({ behavior: "smooth" });
    }
  }
}

// ==========================================================================
// RENDER MODE A: FOCUS MODE
// ==========================================================================
function renderFocusMode() {
  const subset = getActiveQuestionsSubset();
  if (!subset.length) return;
  
  if (AppState.activeQuestionGlobalIdx < 0) AppState.activeQuestionGlobalIdx = 0;
  if (AppState.activeQuestionGlobalIdx >= subset.length) AppState.activeQuestionGlobalIdx = subset.length - 1;
  
  const q = subset[AppState.activeQuestionGlobalIdx];
  const viewport = document.getElementById("mainViewport");
  
  const btnPassage = document.getElementById("btnOpenPassage");
  if (q.passage) {
    btnPassage.style.display = "inline-flex";
  } else {
    btnPassage.style.display = "none";
  }
  
  viewport.innerHTML = `
    <div style="max-width:680px;margin:0 auto;">
      ${renderSingleQuestionCard(q, AppState.activeQuestionGlobalIdx + 1, subset.length)}
    </div>
  `;
  
  updateDockNav(AppState.activeQuestionGlobalIdx, subset.length);
  requestAnimationFrame(() => triggerMathTypesetting(viewport));
}

// ==========================================================================
// RENDER MODE B: CONTINUOUS LIST MODE
// ==========================================================================
function renderListMode() {
  const subset = getActiveQuestionsSubset();
  const viewport = document.getElementById("mainViewport");
  document.getElementById("btnOpenPassage").style.display = "none";
  
  let html = `<div style="max-width:760px;margin:0 auto;">`;
  
  let lastGroupKey = "";
  let headingIdx = 0;
  
  subset.forEach((q, idx) => {
    const groupKey = (AppState.currentSubject === 'physics' || AppState.currentSubject === 'history') ? (q.taskId || q.sectionId) : q.sectionId;
    const groupTitle = (AppState.currentSubject === 'physics' || AppState.currentSubject === 'history') ? (q.taskName || q.taskTitle) : q.sectionTitle;
    
    if (groupKey !== lastGroupKey) {
      lastGroupKey = groupKey;
      html += `
        <div id="sec-heading-${headingIdx}" style="margin:2.5rem 0 1rem;padding-bottom:0.5rem;border-bottom:2px solid var(--border-accent);">
          <div style="font-size:0.75rem;font-weight:700;color:var(--accent-base);letter-spacing:0.1em;text-transform:uppercase;">${escapeHtml(groupTitle)}</div>
        </div>
      `;
      headingIdx++;
    }
    
    if (q.passage && q.taskName && AppState.currentSubject === 'english' && (idx === 0 || subset[idx-1].taskName !== q.taskName)) {
      html += `
        <div class="task-passage-container">
          <div class="task-passage-header">
            <span class="task-passage-title">${escapeHtml(q.taskTitle || q.taskName)}</span>
            <span style="font-size:0.75rem;color:var(--text-tertiary);">Bài đọc</span>
          </div>
          <div class="task-passage-content">${q.passage}</div>
        </div>
      `;
    }
    
    html += renderSingleQuestionCard(q, idx + 1, subset.length);
  });
  
  html += `</div>`;
  viewport.innerHTML = html;
  
  updateDockNav(AppState.activeQuestionGlobalIdx, subset.length);
  requestAnimationFrame(() => triggerMathTypesetting(viewport));
}

function renderSingleQuestionCard(q, displayNum, totalCount) {
  const isFlagged = AppState.flaggedQuestions.has(q.id);
  const userAns = AppState.userAnswers[q.id];
  
  let isAnswered = false;
  if (q.type === 'true_false' || q.items) {
    isAnswered = (userAns && typeof userAns === 'object' && Object.keys(userAns).length > 0);
  } else {
    isAnswered = (userAns !== undefined && userAns !== "");
  }
  
  let contentHtml = "";
  
  if (q.type === 'true_false' || q.items) {
    contentHtml = renderTrueFalseWidget(q, userAns);
  } else if (q.sentences && Object.keys(q.sentences).length > 0) {
    contentHtml = renderSentenceOrderWidget(q, userAns);
  } else if (q.model_answer) {
    contentHtml = renderWritingWidget(q, userAns);
  } else {
    contentHtml = renderStandardMCQOptions(q, userAns);
  }
  
  let imageHtml = "";
  if (q.image) {
    imageHtml = `
      <div class="q-image-card" onclick="openImageModal('${escapeHtml(q.image)}')">
        <div class="q-image-wrapper">
          <img src="${escapeHtml(q.image)}" alt="Hình minh họa câu hỏi" class="q-image" loading="lazy" onerror="this.closest('.q-image-card').style.display='none'">
        </div>
        <div class="q-image-zoom-tag">
          ${ICONS.search} <span>Nhấp để phóng to hình ảnh</span>
        </div>
      </div>
    `;
  }
  
  return `
    <div class="question-envelope ${isFlagged ? 'is-flagged' : ''} ${isAnswered ? 'is-answered' : ''}" id="card-${q.id}">
      <div class="q-header-row">
        <div class="q-badge-wrap">
          <span class="q-idx-tag">${escapeHtml(q.label || ('Câu ' + displayNum))} (${displayNum} / ${totalCount})</span>
          <span class="q-task-tag">${escapeHtml(q.taskName || q.sectionTitle || '')}</span>
        </div>
        
        <button class="flag-btn ${isFlagged ? 'active' : ''}" onclick="toggleFlag('${q.id}')">
          ${isFlagged ? ICONS.bookmarkFilled : ICONS.bookmark}
          <span>${isFlagged ? 'Đã đánh dấu' : 'Đánh dấu xem lại'}</span>
        </button>
      </div>
      
      <div class="q-prompt-text">${renderQuestionPromptWithBanner(q.prompt)}</div>
      
      ${imageHtml}
      ${contentHtml}
    </div>
  `;
}

  if (AppState.userAnswers[qid][subId] === isTrue) {
    delete AppState.userAnswers[qid][subId];
  } else {

  }
  
  saveSessionDebounced();
  
  updateProgressUI();

  if (AppState.viewMode === "focus") {
    renderFocusMode();

    const card = document.getElementById("card-" + qid);
    if (card) {
      const subset = getActiveQuestionsSubset();
      const subIdx = subset.findIndex(x => x.id === qid);

      const q = (subIdx !== -1) ? subset[subIdx] : findQuestionById(qid);

      tmp.innerHTML = renderSingleQuestionCard(q, displayNum, subset.length);
      card.replaceWith(tmp.firstElementChild);
