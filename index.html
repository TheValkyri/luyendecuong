// ==========================================================================
// INTELLIGENT WRITING EVALUATION & NORMALIZATION
// ==========================================================================
function normalizeSentence(str) {
  if (!str) return "";
  let s = str.trim().toLowerCase();
  
  s = s.replace(/[\u2018\u2019\u201a\u201b\u00b4\`]/g, "'");
  s = s.replace(/[\u201c\u201d\u201e\u201f]/g, '"');
  s = s.replace(/[\u2013\u2014]/g, "-");
  
  s = s.replace(/\bhasn't\b/g, "has not")
       .replace(/\bhaven't\b/g, "have not")
       .replace(/\bdon't\b/g, "do not")
       .replace(/\bdoesn't\b/g, "does not")
       .replace(/\bdidn't\b/g, "did not")
       .replace(/\bcan't\b/g, "cannot")
       .replace(/\bwon't\b/g, "will not")
       .replace(/\bshouldn't\b/g, "should not")
       .replace(/\bmustn't\b/g, "must not")
       .replace(/\bneedn't\b/g, "need not")
       .replace(/\baren't\b/g, "are not")
       .replace(/\bisn't\b/g, "is not")
       .replace(/\bwasn't\b/g, "was not")
       .replace(/\bweren't\b/g, "were not")
       .replace(/\bit's\b/g, "it is")
       .replace(/\bthat's\b/g, "that is")
       .replace(/\bthere's\b/g, "there is")
       .replace(/\bi've\b/g, "i have")
       .replace(/\bwe've\b/g, "we have")
       .replace(/\byou've\b/g, "you have")
       .replace(/\bthey've\b/g, "they have")
       .replace(/\bi'm\b/g, "i am")
       .replace(/\bwe're\b/g, "we are")
       .replace(/\byou're\b/g, "you are")
       .replace(/\bthey're\b/g, "they are");

  s = s.replace(/\s+/g, " ");
  s = s.replace(/[.,!?;:]+$/, "");
  return s.trim();
}

function computeSentenceSimilarity(s1, s2) {
  if (s1 === s2) return 1.0;
  if (!s1 || !s2) return 0.0;
  
  const w1 = s1.split(/\s+/).filter(Boolean);
  const w2 = s2.split(/\s+/).filter(Boolean);
  if (w1.length === 0 || w2.length === 0) return 0.0;
  
  let matches = 0;
  const pool = [...w2];
  for (const word of w1) {
    const idx = pool.indexOf(word);
    if (idx !== -1) {
      matches++;
      pool.splice(idx, 1);
    }
  }
  
  return (2.0 * matches) / (w1.length + w2.length);
}

function gradeWritingAnswer(userText, question) {
  if (!userText || !userText.trim()) {
    return { score: 0, isCorrect: false, feedback: "Chưa nhập câu trả lời", matchedTarget: question.model_answer };
  }
  
  const userNorm = normalizeSentence(userText);
  if (!userNorm) {
    return { score: 0, isCorrect: false, feedback: "Chưa nhập câu trả lời", matchedTarget: question.model_answer };
  }
  
  const targets = [];
  if (question.model_answer) targets.push(question.model_answer);
  if (Array.isArray(question.acceptable)) {
    question.acceptable.forEach(ans => {
      if (!targets.includes(ans)) targets.push(ans);
    });
  }
  
  const rawCue = (question.cue || "").replace(/\.{2,}$/, "").trim();
  const cueNorm = normalizeSentence(rawCue);
  let userPrefixedNorm = "";
  if (cueNorm && !userNorm.startsWith(cueNorm)) {
    userPrefixedNorm = normalizeSentence(rawCue + " " + userText);
  }
  
  let maxSim = 0;
  let bestTarget = question.model_answer || "";
  
  for (const t of targets) {
    const tNorm = normalizeSentence(t);
    if (!tNorm) continue;
    
    if (userNorm === tNorm || (userPrefixedNorm && userPrefixedNorm === tNorm)) {
      return {
        score: 1.0,
        isCorrect: true,
        feedback: "Chính xác tuyệt đối (1.0đ)",
        matchedTarget: t
      };
    }
    
    const sim1 = computeSentenceSimilarity(userNorm, tNorm);
    const sim2 = userPrefixedNorm ? computeSentenceSimilarity(userPrefixedNorm, tNorm) : 0;
    const currentMax = Math.max(sim1, sim2);
    
    if (currentMax > maxSim) {
      maxSim = currentMax;
      bestTarget = t;
    }
  }
  
  if (maxSim >= 0.88) {
    return {
      score: 1.0,
      isCorrect: true,
      feedback: "Chính xác (đạt yêu cầu cấu trúc, 1.0đ)",
      matchedTarget: bestTarget
    };
  } else if (maxSim >= 0.68) {
    return {
      score: 0.5,
      isCorrect: true,
      feedback: "Đúng ý chính / cấu trúc cơ bản (+0.5đ)",
      matchedTarget: bestTarget
    };
  }
  
  return {
    score: 0,
    isCorrect: false,
    feedback: "Chưa đúng cấu trúc ngữ pháp",
    matchedTarget: bestTarget
  };
}

function updateWritingAutoFeedback(qid) {
  const box = document.getElementById(`compare-${qid}`);
  if (!box) return;
  const subset = getActiveQuestionsSubset();
  const q = subset.find(x => x.id === qid);
  if (!q) return;
  
  const userAns = AppState.userAnswers[qid] || "";
  const previewEl = box.querySelector(".auto-grade-preview");
  if (!previewEl) return;
  
  if (!userAns.trim()) {
    previewEl.innerHTML = `<span style="color:var(--text-tertiary);">Chưa nhập câu trả lời</span>`;
    return;
  }
  
  const res = gradeWritingAnswer(userAns, q);
  let color = "var(--danger)";
  if (res.score >= 1.0) color = "var(--success)";
  else if (res.score >= 0.5) color = "var(--warning)";
  
  previewEl.innerHTML = `<span style="color:${color};font-weight:600;">${escapeHtml(res.feedback)}</span>`;
}

function renderWritingWidget(q, userAns) {
  const val = userAns || "";
  const words = val.trim() ? val.trim().split(/\s+/).length : 0;
  const selfGrade = AppState.selfGrades[q.id];
  
  let otherVariantsHtml = "";
  if (Array.isArray(q.acceptable) && q.acceptable.length > 1) {
    const alts = q.acceptable.filter(x => x !== q.model_answer).slice(0, 3);
    if (alts.length > 0) {
      otherVariantsHtml = `
        <div style="font-size:0.75rem;color:var(--text-tertiary);margin-top:0.4rem;">
          <b>Cách viết tương đương khác:</b><br>
          ${alts.map(a => `<span style="display:inline-block;margin-right:0.5rem;color:var(--text-secondary);">• ${escapeHtml(a)}</span>`).join("")}
        </div>
      `;
    }
  }

  let autoGradeBadge = "";
  if (val.trim()) {
    const autoRes = gradeWritingAnswer(val, q);
    let color = autoRes.score >= 1 ? "var(--success)" : (autoRes.score >= 0.5 ? "var(--warning)" : "var(--danger)");
    autoGradeBadge = `<span style="color:${color};font-weight:600;">${escapeHtml(autoRes.feedback)}</span>`;
  } else {
    autoGradeBadge = `<span style="color:var(--text-tertiary);">Chưa nhập câu trả lời</span>`;
  }

  return `
    <div class="writing-container">
      <div class="writing-cue"><b>Gợi ý mở đầu:</b> ${escapeHtml(q.cue)}</div>
      
      <textarea class="writing-textarea" placeholder="Nhập câu viết lại đầy đủ của bạn ở đây..." oninput="onWritingChange('${q.id}', this)">${escapeHtml(val)}</textarea>
      
      <div class="writing-tools">
        <span class="writing-word-count">${words} từ</span>
        <button class="dock-nav-btn" style="padding:0.35rem 0.75rem;font-size:0.75rem;" onclick="toggleWritingCompare('${q.id}')">
          ${ICONS.eye}
          <span>So khớp đáp án mẫu</span>
        </button>
      </div>
      
      <div class="writing-compare-box" id="compare-${q.id}">
        <div style="font-size:0.75rem;font-weight:700;color:var(--text-secondary);">ĐÁP ÁN CHUẨN CỦA ĐỀ CƯƠNG:</div>
        <div class="model-ans-text">→ ${escapeHtml(q.model_answer)}</div>
        ${otherVariantsHtml}
        
        <div style="margin-top:0.6rem;padding:0.4rem 0.6rem;background:var(--bg-surface);border-radius:var(--radius-xs);font-size:0.75rem;border:1px solid var(--border-subtle);">
          <span style="color:var(--text-tertiary);">Hệ thống chấm: </span>
          <span class="auto-grade-preview">${autoGradeBadge}</span>
        </div>
        
        <div style="font-size:0.72rem;color:var(--text-tertiary);margin-top:0.6rem;">Tự điều chỉnh điểm (mặc định hệ thống tự động chấm điểm tối đa):</div>
        <div class="self-grade-group">
          <button class="self-grade-btn ${selfGrade===1?'active':''}" onclick="setWritingGrade('${q.id}', 1, event)">1.0đ (Chính xác)</button>
          <button class="self-grade-btn ${selfGrade===0.5?'active':''}" onclick="setWritingGrade('${q.id}', 0.5, event)">0.5đ (Đúng ý / Sai nhỏ)</button>
          <button class="self-grade-btn ${selfGrade===0?'active':''}" onclick="setWritingGrade('${q.id}', 0, event)">0đ (Chưa đúng)</button>
        </div>
      </div>
    </div>
  `;
}

  saveSessionDebounced();
}

  AudioFX.init();
  AudioFX.tap();
  AppState.userAnswers[qid] = optIdx;
  
  if (AppState.viewMode === "focus") {
    renderFocusMode();
  } else {
    const subset = getActiveQuestionsSubset();
    const q = subset.find(x => x.id === qid);
    const idx = subset.indexOf(q);
    const card = document.getElementById(`card-${qid}`);
    if (card && q) {
      card.outerHTML = renderSingleQuestionCard(q, idx + 1, subset.length);
    }
  }
  
  updateProgressUI();
  saveSessionDebounced();
}

function onWritingChange(qid, textarea) {
  AppState.userAnswers[qid] = textarea.value;
  const countEl = textarea.parentElement.querySelector(".writing-word-count");
  if (countEl) {
    const w = textarea.value.trim() ? textarea.value.trim().split(/\s+/).length : 0;
    countEl.textContent = `${w} từ`;
  }
  
  const card = document.getElementById(`card-${qid}`);
  if (card) {
    card.classList.toggle("is-answered", textarea.value.trim().length > 0);
  }
  
  updateWritingAutoFeedback(qid);
  updateProgressUI();
  saveSessionDebounced();
}

function toggleWritingCompare(qid) {
  AudioFX.init();
  AudioFX.tap();
  const box = document.getElementById(`compare-${qid}`);
  if (box) {
    box.classList.toggle("active");
  }
}

function setWritingGrade(qid, grade, ev) {
  AudioFX.init();
  AudioFX.tap();
  AppState.selfGrades[qid] = grade;
  const box = document.getElementById(`compare-${qid}`);
  if (box) {
    box.querySelectorAll(".self-grade-btn").forEach(btn => {
      btn.classList.remove("active");
    });
    const target = (ev && ev.target) || (window.event && window.event.target);
    if (target) {
      target.classList.add("active");
    }
  }
  saveSessionDebounced();
}

function toggleFlag(qid) {
  AudioFX.init();
  AudioFX.tap();
  if (AppState.flaggedQuestions.has(qid)) {
    AppState.flaggedQuestions.delete(qid);
  } else {
    AppState.flaggedQuestions.add(qid);
  }
  
  const card = document.getElementById(`card-${qid}`);
  if (card) {
    const isFl = AppState.flaggedQuestions.has(qid);
    card.classList.toggle("is-flagged", isFl);
    const flagBtn = card.querySelector(".flag-btn");
    if (flagBtn) {
      flagBtn.classList.toggle("active", isFl);
      flagBtn.innerHTML = `
        ${isFl ? ICONS.bookmarkFilled : ICONS.bookmark}
        <span>${isFl ? 'Đã đánh dấu' : 'Đánh dấu xem lại'}</span>
      `;
    }
  }
  
  renderMatrixGrid();
  saveSessionDebounced();
}

// ==========================================================================
// NAVIGATION (Prev / Next)
// ==========================================================================
function navigateQuestion(delta) {
  AudioFX.init();
  AudioFX.tap();
  const subset = getActiveQuestionsSubset();
  const newIdx = AppState.activeQuestionGlobalIdx + delta;
  
  if (newIdx >= 0 && newIdx < subset.length) {
    AppState.activeQuestionGlobalIdx = newIdx;
    
    if (AppState.viewMode === "focus") {
      renderFocusMode();
      window.scrollTo({ top: 0, behavior: "smooth" });
    } else {
      const q = subset[newIdx];
      const el = document.getElementById(`card-${q.id}`);
      if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
      updateDockNav(newIdx, subset.length);
    }
    saveSessionDebounced();
  }
}

function jumpToQuestion(globalIdx) {
  closeMatrixSheet();
  AppState.activeQuestionGlobalIdx = globalIdx;
  
  if (AppState.viewMode === "focus") {
    renderFocusMode();
    window.scrollTo({ top: 0, behavior: "smooth" });
  } else {
    const subset = getActiveQuestionsSubset();
    const q = subset[globalIdx];
    if (q) {
      const el = document.getElementById(`card-${q.id}`);
      if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
    }
    updateDockNav(globalIdx, subset.length);
  }
  saveSessionDebounced();
}

function updateDockNav(curIdx, totalCount) {
  document.getElementById("dockCounter").textContent = `${curIdx + 1} / ${totalCount}`;
  document.getElementById("btnPrev").disabled = (curIdx === 0);
  document.getElementById("btnNext").disabled = (curIdx === totalCount - 1);
}

function updateProgressUI() {
  const subset = getActiveQuestionsSubset();
  const answeredCount = subset.filter(q => {
    const ans = AppState.userAnswers[q.id];
    if (q.type === 'true_false' || q.items) {
      return (ans && typeof ans === 'object' && Object.keys(ans).length > 0);
    }
    return ans !== undefined && ans !== "";
  }).length;
  
  const pct = subset.length ? Math.round((answeredCount / subset.length) * 100) : 0;
  document.getElementById("progressFill").style.width = `${pct}%`;
}

function openMatrixSheet() {
  AudioFX.init();
  AudioFX.tap();
  renderMatrixGrid();
  document.getElementById("matrixSheet").classList.add("open");
}

function closeMatrixSheet(e) {
  if (e && e.target !== e.currentTarget && e.target.tagName !== "BUTTON") return;
  document.getElementById("matrixSheet").classList.remove("open");
}

function renderMatrixGrid() {
  const subset = getActiveQuestionsSubset();
  const grid = document.getElementById("matrixGrid");
  
  let html = "";
  subset.forEach((q, idx) => {
    const ans = AppState.userAnswers[q.id];
    let isAnswered = false;
    if (q.type === 'true_false' || q.items) {
      isAnswered = (ans && typeof ans === 'object' && Object.keys(ans).length > 0);
    } else {
      isAnswered = (ans !== undefined && ans !== "");
    }
    const isFlagged = AppState.flaggedQuestions.has(q.id);
    const isCur = (idx === AppState.activeQuestionGlobalIdx);
    
    html += `
      <button class="matrix-cell ${isAnswered ? 'answered' : ''} ${isFlagged ? 'flagged' : ''} ${isCur ? 'active-cur' : ''}" onclick="jumpToQuestion(${idx})">
        ${idx + 1}
      </button>
    `;
  });
  
  grid.innerHTML = html;
}

function confirmSubmitExam() {
  AudioFX.init();
  AudioFX.tap();
  const subset = getActiveQuestionsSubset();
  const unanswered = subset.filter(q => {
    const ans = AppState.userAnswers[q.id];
    if (q.type === 'true_false' || q.items) {
      return !ans || typeof ans !== 'object' || Object.keys(ans).length === 0;
    }
    return ans === undefined || ans === "";
  });
  const flagged = subset.filter(q => AppState.flaggedQuestions.has(q.id));
  
  let msg = "Bạn có chắc chắn muốn nộp bài thi không?";
  if (unanswered.length > 0 || flagged.length > 0) {
    msg = `Chú ý:
• Bạn còn ${unanswered.length} câu chưa trả lời.
• Bạn có ${flagged.length} câu đang đánh dấu xem lại.

Bạn có muốn nộp bài ngay bây giờ không?`;
  }
  
  if (confirm(msg)) {
    finalizeExam();
  }
}

let currentReviewRecord = null;
let currentReviewFilter = "all";

function finalizeExam() {
  stopTimer();
  AppState.isFinished = true;
  clearSession();
  
  const subset = getActiveQuestionsSubset();
  let correctMCQ = 0;
  let totalMCQ = 0;
  let writingScore = 0;
  let writingMax = 0;
  
  const breakdown = [];
  
  let tfScore = 0;
  let tfMax = 0;
  let totalTF = 0;

  subset.forEach(q => {
    if (q.model_answer) {
      writingMax += 1;
      const userText = AppState.userAnswers[q.id] || "";
      const autoGrade = gradeWritingAnswer(userText, q);
      const manualGrade = AppState.selfGrades[q.id];
      
      let finalScore = autoGrade.score;
      if (manualGrade !== undefined && manualGrade !== null) {
        finalScore = Math.max(autoGrade.score, manualGrade);
      }
      
      writingScore += finalScore;
      breakdown.push({
        id: q.id,
        label: q.label,
        prompt: q.prompt,
        cue: q.cue,
        userAns: userText,
        correctAnswer: q.model_answer,
        acceptable: q.acceptable || [],
        isCorrect: (finalScore >= 0.5),
        isWriting: true,
        score: finalScore,
        feedback: autoGrade.feedback,
        explanation: q.explanation || null,
        image: q.image || null
      });
    } else if (q.type === 'true_false' || q.items) {
      totalTF++;
      tfMax += 1.0;
      const userAnsObj = AppState.userAnswers[q.id] || {};
      let subCorrectCount = 0;
      const itemResults = (q.items || []).map(it => {
        const userChoice = userAnsObj[it.id];
        const isSubCor = (userChoice === it.correct);
        if (isSubCor) subCorrectCount++;
        return {
          id: it.id,
          text: it.text,
          userChoice: userChoice,
          correct: it.correct,
          isCorrect: isSubCor,
          explanation: it.explanation || ""
        };
      });

      let qScore = 0;
      if (subCorrectCount === 4) qScore = 1.0;
      else if (subCorrectCount === 3) qScore = 0.5;
      else if (subCorrectCount === 2) qScore = 0.25;
      else if (subCorrectCount === 1) qScore = 0.1;
      tfScore += qScore;

      breakdown.push({
        id: q.id,
        label: q.label,
        prompt: q.prompt,
        type: 'true_false',
        isTrueFalse: true,
        isWriting: false,
        isCorrect: (subCorrectCount === 4),
        subCorrectCount: subCorrectCount,
        score: qScore,
        items: itemResults,
        taskName: q.taskName,
        taskTitle: q.taskTitle,
        sectionTitle: q.sectionTitle,
        explanation: q.explanation || null
      });
    } else {
      totalMCQ++;
      const userChoice = AppState.userAnswers[q.id];
      const isCor = (userChoice === q.answer);
      if (isCor) correctMCQ++;
      
      const letters = ['A', 'B', 'C', 'D'];
      breakdown.push({
        id: q.id,
        label: q.label,
        prompt: q.prompt,
        userChoiceIdx: userChoice,
        userChoice: userChoice !== undefined ? letters[userChoice] : "Chưa chọn",
        correctLetter: letters[q.answer],
        correctAnswerIdx: q.answer,
        options: q.options || [],
        sentences: q.sentences || null,
        taskName: q.taskName,
        taskTitle: q.taskTitle,
        passage: q.passage || null,
        explanation: q.explanation || null,
        image: q.image || null,
        isCorrect: isCor,
        isWriting: false
      });
    }
  });
  
  const totalWeight = totalMCQ + writingMax + tfMax;
  const earnedWeight = correctMCQ + writingScore + tfScore;
  const grade10 = totalWeight > 0 ? Math.round((earnedWeight / totalWeight) * 10 * 10) / 10 : 0;
  
  const record = {
    id: "sub_" + Date.now(),
    subject: AppState.currentSubject,
    subjectName: (AppState.currentSubject === "history" ? "Lịch Sử 11" : (AppState.currentSubject === "physics" ? "Vật Lí 11" : "Tiếng Anh 11")),
    studentName: AppState.studentName,
    practiceMode: AppState.practiceMode,
    grade10: grade10,
    correctMCQ: correctMCQ,
    totalMCQ: totalMCQ,
    writingScore: writingScore,
    writingMax: writingMax,
    tfScore: Math.round(tfScore * 100) / 100,
    tfMax: tfMax,
    totalTF: totalTF,
    elapsedSeconds: AppState.elapsedSeconds,
    timestamp: new Date().toISOString(),
    breakdown: breakdown
  };
  
  currentReviewRecord = record;
  currentReviewFilter = "all";
  saveStudentSubmission(record);
  if (window.Telemetry && typeof Telemetry.completeSession === "function") {
    try {
      Telemetry.completeSession(record);
    } catch(te) {
      console.warn("[Telemetry] Error completing session", te);
    }
  }
  renderResultsScreen(record);
}

function setReviewFilter(filterMode) {
  AudioFX.init();
  AudioFX.tap();
  currentReviewFilter = filterMode;
  if (!currentReviewRecord) return;
  renderResultsScreen(currentReviewRecord);
}

function renderReviewItems(breakdown, filterMode) {
  const letters = ['A', 'B', 'C', 'D'];
  let html = "";
  
  breakdown.forEach((rawItem, idx) => {
    const orig = findQuestionById(rawItem.id, (currentReviewRecord && currentReviewRecord.subject) || AppState.currentSubject);
    const item = {
      ...(orig || {}),
      ...rawItem,
      options: (rawItem.options && rawItem.options.length) ? rawItem.options : (orig ? orig.options : []),
      sentences: (rawItem.sentences && Object.keys(rawItem.sentences).length) ? rawItem.sentences : (orig ? orig.sentences : null),
      passage: rawItem.passage || (orig ? orig.passage : null),
      taskName: rawItem.taskName || (orig ? orig.taskName : ''),
      taskTitle: rawItem.taskTitle || (orig ? orig.taskTitle : ''),
      sectionTitle: rawItem.sectionTitle || (orig ? orig.sectionTitle : ''),
      cue: rawItem.cue || (orig ? orig.cue : ''),
      model_answer: rawItem.model_answer || (orig ? orig.model_answer : ''),
      acceptable: rawItem.acceptable || (orig ? orig.acceptable : []),
      explanation: rawItem.explanation || (orig ? orig.explanation : null),
      image: rawItem.image || (orig ? orig.image : null),
      correctAnswerIdx: rawItem.correctAnswerIdx !== undefined ? rawItem.correctAnswerIdx : (orig ? orig.answer : undefined),
      correctLetter: rawItem.correctLetter || (orig && orig.answer !== undefined ? letters[orig.answer] : '')
    };
    
    if (item.userChoiceIdx === undefined && typeof item.userChoice === "string") {
      const uIdx = letters.indexOf(item.userChoice.trim().toUpperCase());
      if (uIdx !== -1) item.userChoiceIdx = uIdx;
    }
    if (item.userChoice === undefined && item.userChoiceIdx !== undefined && item.userChoiceIdx !== null) {
      item.userChoice = letters[item.userChoiceIdx];
    }
    
    if (filterMode === 'wrong' && item.isCorrect) return;
    if (filterMode === 'correct' && !item.isCorrect) return;
    
    const isUnanswered = (!item.isWriting && (item.userChoiceIdx === undefined || item.userChoiceIdx === null)) || (item.isWriting && !item.userAns);
    
    let statusColor = "var(--success)";
    let statusBg = "var(--success-soft)";
    let statusText = "ĐÚNG";
    let statusIcon = ICONS.check;
    
    if (isUnanswered) {
      statusColor = "var(--text-tertiary)";
      statusBg = "var(--bg-surface-elevated)";
      statusText = "CHƯA TRẢ LỜI";
      statusIcon = ICONS.info;
    } else if (item.isWriting) {
      if (item.score >= 1.0) {
        statusColor = "var(--success)";
        statusBg = "var(--success-soft)";
        statusText = "ĐÚNG (1.0đ)";
        statusIcon = ICONS.check;
      } else if (item.score >= 0.5) {
        statusColor = "var(--warning)";
        statusBg = "rgba(180, 83, 9, 0.12)";
        statusText = "ĐÚNG 1 PHẦN (0.5đ)";
        statusIcon = ICONS.check;
      } else {
        statusColor = "var(--danger)";
        statusBg = "var(--danger-soft)";
        statusText = "SAI (0đ)";
        statusIcon = ICONS.x;
      }
    } else if (item.isTrueFalse || item.type === 'true_false') {
      if ((item.score || 0) >= 1.0) {
        statusColor = "var(--success)";
        statusBg = "var(--success-soft)";
        statusText = "ĐÚNG (1.0đ)";
        statusIcon = ICONS.check;
      } else if ((item.score || 0) >= 0.25) {
        statusColor = "var(--warning)";
        statusBg = "rgba(180, 83, 9, 0.12)";
        statusText = `ĐÚNG 1 PHẦN (${item.score}đ)`;
        statusIcon = ICONS.check;
      } else {
        statusColor = "var(--danger)";
        statusBg = "var(--danger-soft)";
        statusText = `SAI (${item.score || 0}đ)`;
        statusIcon = ICONS.x;
      }
    } else if (!item.isCorrect) {
      statusColor = "var(--danger)";
      statusBg = "var(--danger-soft)";
      statusText = "SAI";
      statusIcon = ICONS.x;
    }
    
    let bodyContent = "";
    
    if (item.isWriting) {
      let acceptableListHtml = "";
      if (item.acceptable && item.acceptable.length > 1) {
        const otherVariants = item.acceptable.filter(x => x !== item.correctAnswer).slice(0, 3);
        if (otherVariants.length > 0) {
          acceptableListHtml = `
            <div style="margin-top:0.5rem;font-size:0.75rem;color:var(--text-tertiary);line-height:1.4;">
              <b>Biến thể hợp lệ khác:</b><br>
              ${otherVariants.map(v => `<span style="display:inline-block;margin-right:0.6rem;color:var(--text-secondary);">• ${escapeHtml(v)}</span>`).join("")}
            </div>
          `;
        }
      }

      bodyContent = `
        <div style="background:var(--bg-surface);padding:0.85rem 1rem;border-radius:var(--radius-sm);margin-bottom:0.6rem;border:1px solid var(--border-subtle);">

            <span class="opt-circle">${letters[oIdx]}</span>

        <div style="font-size:0.82rem;display:flex;gap:1.5rem;padding:0.6rem 0.85rem;background:var(--bg-surface);border-radius:var(--radius-xs);border:1px solid var(--border-subtle);flex-wrap:wrap;align-items:center;">

function viewPassageModalById(qid) {
  AudioFX.init();
  AudioFX.tap();
  const q = FlatQuestions.find(x => x.id === qid);
  if (!q || !q.passage) return;
  document.getElementById("passageSheetTitle").textContent = q.taskTitle || q.taskName;
  document.getElementById("passageSheetBody").innerHTML = q.passage;
  document.getElementById("passageSheet").classList.add("open");
}

// ==========================================================================
// HISTORY DRAWER CONTROLLERS (MULTI-SUBJECT)
// ==========================================================================
function openHistorySheet() {
  AudioFX.init();
  AudioFX.tap();
  renderHistoryList();
  document.getElementById("historySheet").classList.add("open");
}

function closeHistorySheet(e) {
  if (e && e.target !== e.currentTarget && e.target.tagName !== "BUTTON" && !e.target.closest('button')) return;
  document.getElementById("historySheet").classList.remove("open");
}

function setHistorySubjectFilter(sub) {
  AudioFX.init();
  AudioFX.tap();
  historySubjectFilter = sub;
  renderHistoryList();
}

function renderHistoryList() {
  const records = getAllSubmissions();
  const container = document.getElementById("historySheetBody");
  
  const engRecs = records.filter(r => (r.subject || 'english') === 'english');
  const phyRecs = records.filter(r => r.subject === 'physics');
  const hisRecs = records.filter(r => r.subject === 'history');
  
  const filtered = records.filter(r => {
    if (historySubjectFilter === 'english') return (r.subject || 'english') === 'english';
    if (historySubjectFilter === 'physics') return r.subject === 'physics';
    if (historySubjectFilter === 'history') return r.subject === 'history';
    return true;
  });
  
  let filterBar = `
    <div class="filter-pills-bar" style="margin-bottom:1rem;">
      <button class="filter-pill-btn ${historySubjectFilter==='all'?'active':''}" onclick="setHistorySubjectFilter('all')">
        <span>Tất cả (${records.length})</span>
      </button>
      <button class="filter-pill-btn ${historySubjectFilter==='english'?'active':''}" onclick="setHistorySubjectFilter('english')">
        ${ICONS.languages} <span>Tiếng Anh (${engRecs.length})</span>
      </button>
      <button class="filter-pill-btn ${historySubjectFilter==='physics'?'active':''}" onclick="setHistorySubjectFilter('physics')">
        ${ICONS.atom} <span>Vật Lí (${phyRecs.length})</span>
      </button>
      <button class="filter-pill-btn ${historySubjectFilter==='history'?'active':''}" onclick="setHistorySubjectFilter('history')">
        ${ICONS.landmark} <span>Lịch Sử (${hisRecs.length})</span>
      </button>
    </div>
  `;
  
  if (!filtered.length) {
    container.innerHTML = filterBar + `
      <div style="text-align:center;padding:2.5rem 1rem;color:var(--text-tertiary);">
        ${ICONS.history}
        <div style="margin-top:0.75rem;font-weight:600;color:var(--text-secondary);">Chưa có lịch sử làm bài cho mục này</div>
        <div style="font-size:0.78rem;margin-top:0.25rem;line-height:1.45;">Hoàn thành bài thi và bấm "Nộp bài", toàn bộ kết quả cùng chi tiết đúng/sai sẽ được lưu trữ vĩnh viễn tại đây để bạn ôn tập!</div>
      </div>
    `;
    return;
  }
  
  let html = filterBar + `<div style="display:flex;flex-direction:column;gap:0.75rem;">`;
  filtered.forEach(r => {
    const isPhy = (r.subject === 'physics');
    let scoreColor = "var(--success)";
    if (r.grade10 < 5.0) scoreColor = "var(--danger)";
    else if (r.grade10 < 8.0) scoreColor = "var(--warning)";
    
    const d = new Date(r.timestamp);
    const dateFormatted = d.getDate().toString().padStart(2,'0') + "/" + (d.getMonth()+1).toString().padStart(2,'0') + "/" + d.getFullYear() + " lúc " + d.getHours().toString().padStart(2,'0') + ":" + d.getMinutes().toString().padStart(2,'0');
    const duration = Math.floor(r.elapsedSeconds/60) + " phút " + (r.elapsedSeconds%60) + " giây";
    const achieved = (r.correctMCQ + r.writingScore);
    const total = (r.totalMCQ + r.writingMax);
    const pct = total > 0 ? Math.round((achieved / total) * 100) : 0;
    
    html += `
      <div style="background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:1rem 1.25rem;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0.4rem;">
          <div style="display:flex;align-items:center;gap:0.45rem;">
            <span class="sub-badge sub-badge-${r.subject || 'english'}">
    ${r.subject === 'history' ? ICONS.landmark : (r.subject === 'physics' ? ICONS.atom : ICONS.languages)}
    <span>${r.subject === 'history' ? 'Lịch Sử 11' : (r.subject === 'physics' ? 'Vật Lí 11' : 'Tiếng Anh 11')}</span>
  </span>
            <span style="font-weight:700;font-size:0.95rem;color:var(--text-primary);">${escapeHtml(r.studentName)}</span>
          </div>
          <span style="font-family:var(--font-mono);font-size:1.25rem;font-weight:800;color:${scoreColor};">${r.grade10} <span style="font-size:0.72rem;color:var(--text-tertiary);font-weight:600;">/ 10</span></span>
        </div>
        
        <div style="font-size:0.78rem;color:var(--text-tertiary);line-height:1.5;margin-bottom:0.75rem;">
          <div>• Nộp bài: <b>${dateFormatted}</b></div>
          <div>• Đúng: <b style="color:var(--success);">${achieved}/${total} câu</b> (${pct}%) · Thời gian làm: <b>${duration}</b></div>
          <div>• Phạm vi: <b>${escapeHtml(r.practiceMode)}</b></div>
        </div>
        
        <div style="display:flex;gap:0.5rem;align-items:center;">
          <button class="btn-primary-action" style="padding:0.45rem 0.95rem;font-size:0.78rem;width:auto;" onclick="revisitHistoryRecord('${r.id}')">
            ${ICONS.eye}
            <span>Xem lại chi tiết bài này</span>
          </button>
          <button class="dock-nav-btn" style="padding:0.45rem 0.75rem;font-size:0.78rem;color:var(--danger);" onclick="deleteHistoryRecord('${r.id}')" title="Xóa lần thi này">
            ${ICONS.trash}
          </button>
        </div>
      </div>
    `;
  });
  
  html += `
    <div style="text-align:center;margin-top:1.25rem;">
      <button class="dock-nav-btn" style="color:var(--danger);font-size:0.75rem;margin:0 auto;" onclick="clearAllHistory()">
        ${ICONS.trash}
        <span>Xóa toàn bộ lịch sử thi</span>
      </button>
    </div>
  </div>`;
  
  container.innerHTML = html;
}

function revisitHistoryRecord(subId) {
  closeHistorySheet();
  const records = getAllSubmissions();
  const rec = records.find(r => r.id === subId);
  if (rec) {
    if (rec.subject && rec.subject !== AppState.currentSubject) {
      AppState.currentSubject = rec.subject;
      localStorage.setItem("quiz_subject", rec.subject);
      initFlattenedQuestions();
      updateTopSubjectBadge();
    }
    currentReviewRecord = rec;
    currentReviewFilter = "all";
    renderResultsScreen(rec);
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
}

function deleteHistoryRecord(subId) {
  if (confirm("Bạn có chắc chắn muốn xóa lượt làm bài này khỏi lịch sử?")) {
    let records = getAllSubmissions();
    records = records.filter(r => r.id !== subId);
    localStorage.setItem(SUBMISSIONS_KEY, JSON.stringify(records));
    renderHistoryList();
  }
}

function clearAllHistory() {
  if (confirm("Bạn có chắc muốn xóa toàn bộ lịch sử các lần thi?")) {
    localStorage.removeItem(SUBMISSIONS_KEY);
    localStorage.removeItem(LEGACY_SUBMISSIONS_KEY);
    renderHistoryList();
  }
}

  const records = allRecords.filter(r => {
    if (adminSubjectFilter === 'english') return (r.subject || 'english') === 'english';
    if (adminSubjectFilter === 'physics') return r.subject === 'physics';
    if (adminSubjectFilter === 'history') return r.subject === 'history';
    return true;
  });
  
  const totalSubmissions = records.length;
  const avgScore = totalSubmissions ? (records.reduce((s, r) => s + r.grade10, 0) / totalSubmissions).toFixed(1) : "0.0";
  const maxScore = totalSubmissions ? Math.max(...records.map(r => r.grade10)).toFixed(1) : "0.0";
  const passCount = records.filter(r => r.grade10 >= 5.0).length;
  const passRate = totalSubmissions ? Math.round((passCount / totalSubmissions) * 100) : 0;
  
  const viewport = document.getElementById("mainViewport");
  viewport.innerHTML = `
    <div style="max-width:850px;margin:1.5rem auto;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:1rem;">
        <div>
          <h2 style="font-size:1.4rem;font-weight:800;">Bảng Theo Dõi Học Sinh</h2>
          <p style="font-size:0.8rem;color:var(--text-tertiary);">Theo dõi tiến độ, điểm số và bài làm chi tiết (Tiếng Anh 11 & Vật Lí 11)</p>
        </div>
        
        <div style="display:flex;gap:0.5rem;">

          <button class="dock-nav-btn" onclick="exportSubmissionsCSV()">
            ${ICONS.download}
            <span>Xuất Excel (CSV)</span>
          </button>
          <button class="btn-primary-action" style="width:auto;padding:0.5rem 1rem;font-size:0.85rem;" onclick="renderWelcomeScreen()">
            ${ICONS.arrowLeft}
            <span>Về Bài Thi</span>
          </button>
        </div>
      </div>
      
      <!-- SUBJECT FILTER TABS -->
      <div class="filter-pills-bar" style="margin-bottom:1.25rem;">
        <button class="filter-pill-btn ${adminSubjectFilter==='all'?'active':''}" onclick="setAdminSubjectFilter('all')">
          <span>Tất cả các môn (${allRecords.length})</span>
        </button>
        <button class="filter-pill-btn ${adminSubjectFilter==='english'?'active':''}" onclick="setAdminSubjectFilter('english')">
          ${ICONS.languages} <span>Tiếng Anh 11 (${engRecords.length})</span>
        </button>
        <button class="filter-pill-btn ${adminSubjectFilter==='physics'?'active':''}" onclick="setAdminSubjectFilter('physics')">
          ${ICONS.atom} <span>Vật Lí 11 (${phyRecords.length})</span>
        </button>
        <button class="filter-pill-btn ${adminSubjectFilter==='history'?'active':''}" onclick="setAdminSubjectFilter('history')">
          ${ICONS.landmark} <span>Lịch Sử 11 (${hisRecords.length})</span>
        </button>
      </div>
      
      <div class="report-stats-grid" style="margin-bottom:1.5rem;">
        <div class="stat-box">
          <div class="stat-val">${totalSubmissions}</div>
          <div class="stat-lbl">Lượt nộp bài</div>
        </div>
        <div class="stat-box">
          <div class="stat-val" style="color:var(--accent-base);">${avgScore}</div>
          <div class="stat-lbl">Điểm trung bình</div>
        </div>
        <div class="stat-box">
          <div class="stat-val" style="color:var(--success);">${maxScore}</div>
          <div class="stat-lbl">Điểm cao nhất</div>
        </div>
        <div class="stat-box">
          <div class="stat-val">${passRate}%</div>
          <div class="stat-lbl">Tỉ lệ đạt (≥ 5.0)</div>
        </div>
      </div>
      
      <div class="admin-card-wrap">
        <div class="admin-toolbar">
          <div class="search-input-wrap">
            <span class="search-icon">${ICONS.search}</span>
            <input type="text" id="adminSearchInput" class="custom-input" placeholder="Tìm kiếm theo tên học sinh..." style="padding:0.45rem 0.75rem 0.45rem 2.2rem;font-size:0.82rem;" oninput="filterAdminTable(this.value)">
          </div>
          <button class="dock-nav-btn" style="color:var(--danger);font-size:0.75rem;" onclick="clearAllSubmissions()">
            ${ICONS.trash}
            <span>Xóa lịch sử</span>
          </button>
        </div>
        
        <div style="overflow-x:auto;">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Học sinh</th>
                <th>Môn học</th>
                <th>Hình thức</th>
                <th>Điểm</th>
                <th>Thời gian</th>
                <th>Ngày nộp</th>
                <th>Chi tiết</th>
              </tr>
            </thead>
            <tbody id="adminTableBody">
              ${renderAdminTableRows(records)}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  `;
}

function renderAdminTableRows(records) {
  if (!records.length) {
    return `<tr><td colspan="7" style="text-align:center;padding:2.5rem;color:var(--text-tertiary);">Chưa có lượt nộp bài nào thỏa mãn bộ lọc.</td></tr>`;
  }
  
  return records.map(r => {
    const isPhy = (r.subject === 'physics');
    let scoreColor = "var(--success)";
    if (r.grade10 < 5.0) scoreColor = "var(--danger)";
    else if (r.grade10 < 8.0) scoreColor = "var(--warning)";
    
    const d = new Date(r.timestamp);
    const dateFormatted = `${d.getDate().toString().padStart(2,'0')}/${(d.getMonth()+1).toString().padStart(2,'0')} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
    const duration = `${Math.floor(r.elapsedSeconds/60)}p ${r.elapsedSeconds%60}s`;
    
    return `
      <tr>
        <td><span class="student-name" onclick="viewStudentDetail('${r.id}')">${escapeHtml(r.studentName)}</span></td>
        <td><span class="sub-badge sub-badge-${r.subject || 'english'}">${r.subject === 'history' ? ICONS.landmark : (isPhy ? ICONS.atom : ICONS.languages)} <span>${r.subject === 'history' ? 'SỬ 11' : (isPhy ? 'LÝ 11' : 'ENG 11')}</span></span></td>
        <td><span style="font-size:0.75rem;padding:0.15rem 0.45rem;border-radius:var(--radius-xs);background:var(--bg-surface-elevated);">${escapeHtml(r.practiceMode)}</span></td>
        <td><b style="color:${scoreColor};font-family:var(--font-mono);font-size:0.95rem;">${r.grade10}</b> / 10</td>
        <td style="font-family:var(--font-mono);">${duration}</td>
        <td style="font-size:0.78rem;">${dateFormatted}</td>
        <td>
          <button class="dock-nav-btn" style="padding:0.25rem 0.55rem;font-size:0.72rem;" onclick="viewStudentDetail('${r.id}')">Xem bài</button>
        </td>
      </tr>
    `;
  }).join('');
}

function filterAdminTable(query) {
  const allRecords = getAllSubmissions();
  const filteredBySubject = allRecords.filter(r => {
    if (adminSubjectFilter === 'english') return (r.subject || 'english') === 'english';
    if (adminSubjectFilter === 'physics') return r.subject === 'physics';
    if (adminSubjectFilter === 'history') return r.subject === 'history';
    return true;
  });
  const filtered = filteredBySubject.filter(r => r.studentName.toLowerCase().includes(query.toLowerCase()));
  document.getElementById("adminTableBody").innerHTML = renderAdminTableRows(filtered);
}

function viewStudentDetail(subId) {
  const records = getAllSubmissions();
  const rec = records.find(r => r.id === subId);
  if (!rec) return;
  
  ensureRecordHydratedAndRegraded(rec);
  currentAdminViewRecord = rec;
  currentAdminFilter = "all";
  renderAdminStudentDetailModal();
  document.getElementById("studentDetailSheet").classList.add("open");
}

function setAdminDetailFilter(filterMode) {
  AudioFX.init();
  AudioFX.tap();
  currentAdminFilter = filterMode;
  renderAdminStudentDetailModal();
}

function renderAdminStudentDetailModal() {
  if (!currentAdminViewRecord) return;
  const rec = currentAdminViewRecord;
  const isPhy = (rec.subject === 'physics');
  
  const totalCount = rec.breakdown.length;
  const correctCount = rec.breakdown.filter(x => x.isCorrect).length;
  const wrongCount = totalCount - correctCount;
  
  let scoreColor = "var(--success)";
  if (rec.grade10 < 5.0) scoreColor = "var(--danger)";
  else if (rec.grade10 < 8.0) scoreColor = "var(--warning)";
  
  document.getElementById("studentDetailTitle").innerHTML = `
    <span>Bài làm của: <b>${escapeHtml(rec.studentName)}</b> (${rec.subject === 'history' ? ICONS.landmark : (isPhy ? ICONS.atom : ICONS.languages)} ${rec.subject === 'history' ? 'Lịch Sử 11' : (isPhy ? 'Vật Lí 11' : 'Tiếng Anh 11')})</span>
    <span style="font-family:var(--font-mono);color:${scoreColor};font-size:1.1rem;font-weight:800;margin-left:0.5rem;">${rec.grade10}/10đ</span>
  `;
  
  const container = document.getElementById("studentDetailBody");
  container.innerHTML = `
    <div style="margin-bottom:1.25rem;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);padding:0.75rem 1rem;">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.5rem;font-size:0.8rem;color:var(--text-secondary);margin-bottom:0.75rem;">
        <div>Môn: <b>${escapeHtml(rec.subjectName || (isPhy ? 'Vật Lí 11' : 'Tiếng Anh 11'))}</b> · Hình thức: <b>${escapeHtml(rec.practiceMode)}</b> · Thời gian: <b>${Math.floor(rec.elapsedSeconds/60)}p ${rec.elapsedSeconds%60}s</b></div>
        <div>Trắc nghiệm: <b style="color:var(--success);">${rec.correctMCQ}/${rec.totalMCQ}</b> · Tự luận: <b style="color:var(--accent-base);">${Math.round(rec.writingScore*10)/10}/${rec.writingMax}</b></div>
      </div>
      
      <div class="filter-pills-bar" style="margin-bottom:0;">
        <button class="filter-pill-btn ${currentAdminFilter==='all'?'active':''}" onclick="setAdminDetailFilter('all')">
          <span>Tất cả (${totalCount})</span>
        </button>
        <button class="filter-pill-btn ${currentAdminFilter==='wrong'?'active filter-wrong':''}" onclick="setAdminDetailFilter('wrong')" style="color:var(--danger);">
          ${ICONS.x}
          <span>Chỉ câu làm sai (${wrongCount})</span>
        </button>
        <button class="filter-pill-btn ${currentAdminFilter==='correct'?'active filter-correct':''}" onclick="setAdminDetailFilter('correct')" style="color:var(--success);">
          ${ICONS.check}
          <span>Chỉ câu làm đúng (${correctCount})</span>
        </button>
      </div>
    </div>
    
    <div id="adminDetailReviewContainer">
      ${renderReviewItems(rec.breakdown, currentAdminFilter)}
    </div>
  `;
  requestAnimationFrame(() => triggerMathTypesetting(container));
}

function closeStudentDetailSheet(e) {
  if (e && e.target !== e.currentTarget && e.target.tagName !== "BUTTON") return;
  document.getElementById("studentDetailSheet").classList.remove("open");
}

function exportSubmissionsCSV() {
  const records = getAllSubmissions();
  if (!records.length) {
    alert("Chưa có dữ liệu học sinh để xuất file CSV!");
    return;
  }
  
  let csv = "\uFEFF";
  csv += "Họ và Tên,Môn Học,Hình Thức,Điểm Số (/10),Số Câu Đúng,Tổng Câu,Thời Gian (Giây),Thời Gian Nộp\n";
  
  records.forEach(r => {
    const subName = r.subject === 'history' ? 'Lịch Sử 11' : (r.subject === 'physics' ? 'Vật Lí 11' : 'Tiếng Anh 11');
    const row = [
      `"${r.studentName.replace(/"/g, '""')}"`,
      `"${subName}"`,
      `"${r.practiceMode}"`,
      r.grade10,
      r.correctMCQ + r.writingScore,
      r.totalMCQ + r.writingMax,
      r.elapsedSeconds,
      `"${new Date(r.timestamp).toLocaleString('vi-VN')}"`
    ];
    csv += row.join(",") + "\n";
  });
  
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.setAttribute("href", url);
  link.setAttribute("download", `diem-kiem-tra-thpt-vinh-tuan-${Date.now()}.csv`);
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

function clearAllSubmissions() {
  if (confirm("Bạn có chắc chắn muốn xóa toàn bộ lịch sử điểm số của học sinh?")) {
    localStorage.removeItem(SUBMISSIONS_KEY);
    localStorage.removeItem(LEGACY_SUBMISSIONS_KEY);
    showAdminView();
  }
}

// ==========================================================================
// UTILITY FUNCTIONS
// ==========================================================================
function escapeHtml(str) {
  if (!str) return "";
  const d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}

// ==========================================================================
// APP INITIALIZATION
// ==========================================================================
document.addEventListener("DOMContentLoaded", () => {
  const savedTheme = localStorage.getItem(STORAGE_PREFIX + "theme") || "dark";
  applyTheme(savedTheme);
  initFlattenedQuestions();
  updateTopSubjectBadge();
  renderWelcomeScreen();
});
</script>
</body>
</html>
